<title>CADなんです（体験版）</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22252a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#22252a; --panel:#2b2f36; --panel2:#343941; --panel3:#3c424b; --bd:#454b55;
  --fg:#d8dce2; --fg2:#98a1ad; --acc:#4a90d9; --acc2:#63a8ee;
  --model:#1b1e23; --grid:#282d34; --gridmaj:#333a43;
  --ok:#7bc86c; --warn:#e3b341; --err:#e0655f;
  --hi:#00b0ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);
  font:12px/1.45 "Segoe UI","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------- quick access toolbar ---------- */
#qat{display:flex;align-items:center;gap:2px;height:28px;padding:0 6px;
  background:linear-gradient(#3a4049,#2f343b);border-bottom:1px solid #1a1d21;flex:none}
#qat .brand{font-weight:600;letter-spacing:.5px;color:#cfd6de;margin-right:10px;font-size:12px}
#qat .brand b{color:var(--acc2)}
#qat .ver{color:#7b838f;font-size:10px;font-weight:400;margin-left:5px}
#drop{position:absolute;inset:0;z-index:30;display:none;place-items:center;
  background:rgba(20,40,70,.55);border:3px dashed #63a8ee;color:#fff;font-size:18px}
#drop.on{display:grid}
.qbtn{width:24px;height:22px;display:grid;place-items:center;border-radius:3px;cursor:pointer;color:#c3cad3}
.qbtn .ico{width:16px;height:16px}
.qbtn:hover{background:#4a515c}
.qbtn.off{opacity:.35;pointer-events:none}
#qat .sep{width:1px;height:16px;background:#565d68;margin:0 4px}
#qat .fname{margin-left:auto;color:var(--fg2);font-size:11px;padding-right:6px}

/* ---------- ribbon ---------- */
#ribbon{flex:none;background:var(--panel);border-bottom:1px solid #16181c}
#rtabs{display:flex;height:24px;padding-left:6px;gap:1px;background:#262a30}
.rtab{padding:0 14px;line-height:24px;font-size:11.5px;color:var(--fg2);cursor:pointer;
  border-radius:3px 3px 0 0}
.rtab:hover{color:var(--fg);background:#31363d}
.rtab.on{background:var(--panel);color:#fff}
#rmin{margin-left:auto;padding:0 10px;line-height:24px;color:var(--fg2);cursor:pointer;font-size:10px}
#rmin:hover{color:#fff}
/* 高さは内容なりにする。固定値にすると横スクロールバーの分だけ
   パネル名（作成・修正…）が下から削られる。 */
#rpanels{display:flex;height:auto;padding:2px 4px 0;overflow-x:auto;overflow-y:hidden;
  overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#4a515c #262a30}
#ribbon.min #rpanels{display:none}
#rpanels::-webkit-scrollbar{height:8px}
#rpanels::-webkit-scrollbar-track{background:#262a30}
#rpanels::-webkit-scrollbar-thumb{background:#4a515c;border-radius:4px}
#rpanels::-webkit-scrollbar-thumb:hover{background:#5d6673}
.rpanel{display:flex;flex-direction:column;border-right:1px solid #3a3f47;padding:0 5px;flex:none}
.rpanel .items{display:flex;flex-wrap:wrap;align-content:flex-start;height:94px;gap:1px}
.rpanel .plabel{font-size:10px;color:#7b838f;text-align:center;height:14px;line-height:14px}
.rbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  width:50px;min-width:0;padding:3px 1px 1px;border-radius:3px;cursor:pointer;color:#ccd3db}
.rbtn:hover{background:#454c57;color:#fff}
.rbtn:active{background:var(--acc)}
/* svgIcon() が返すアイコンの見た目。置き場所（リボン・QAT）に依存させない。
   この指定が当たらないと SVG 既定の fill:black が効いて黒い塊になる。 */
.ico{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.rbtn span{margin-top:2px;width:100%;height:22px;overflow:hidden;font-size:9px;line-height:1.15;
  text-align:center;white-space:normal;word-break:break-word}
.rbtn.sm{width:auto;flex-direction:row;gap:4px;padding:2px 6px;height:20px;align-items:center}
.rbtn.sm .ico{width:14px;height:14px}
.rbtn.sm span{margin-top:0;height:auto;width:auto;white-space:nowrap;font-size:10.5px}

/* ---------- main ---------- */
#main{flex:1;display:flex;min-height:0;position:relative}
#cvwrap{flex:1;position:relative;min-width:0;background:var(--model)}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;cursor:none}
#dyn{position:absolute;pointer-events:none;display:none;z-index:5;white-space:nowrap}
#dyn .box{display:inline-block;background:#12151a;border:1px solid #6e7784;color:#e6ebf1;
  padding:1px 5px;font:11px/1.5 Consolas,monospace;border-radius:2px;margin-right:3px}
#dyn .box.act{border-color:var(--acc2);background:#1b2733;color:#fff}
#dyn .tip{display:block;margin-top:3px;background:#12151a;border:1px solid #555c66;
  color:#b9c2cd;padding:1px 5px;font-size:11px;border-radius:2px}
#tooltip{position:absolute;z-index:8;display:none;pointer-events:none;
  background:#12151a;border:1px solid #6e7784;color:#dfe5ec;padding:2px 6px;
  font:11px Consolas,monospace;border-radius:2px}

/* ---------- properties palette ---------- */
#props{width:230px;flex:none;background:var(--panel);border-left:1px solid #16181c;
  display:flex;flex-direction:column;font-size:11px}
#props.hide{display:none}
#props h3{margin:0;padding:5px 8px;background:#333941;font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #22262b}
#props h3 i{cursor:pointer;font-style:normal;color:var(--fg2);padding:0 3px}
#props h3 i:hover{color:#fff}
#propbody{overflow:auto;flex:1}
#propbody::-webkit-scrollbar{width:8px}
#propbody::-webkit-scrollbar-thumb{background:#4a515c;border-radius:4px}
.pgrp{background:#3a4049;color:#bcc4ce;padding:2px 8px;font-size:10.5px;
  border-top:1px solid #2a2e34;border-bottom:1px solid #2a2e34}
.prow{display:flex;align-items:center;border-bottom:1px solid #31363d;min-height:20px}
.prow label{width:88px;flex:none;padding-left:8px;color:#9aa3af;font-size:10.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .val{flex:1;min-width:0}
.prow input,.prow select{width:100%;background:#22262b;border:1px solid transparent;color:#e2e7ed;
  font:11px Consolas,monospace;padding:1px 4px;outline:none}
.prow input:focus,.prow select:focus{border-color:var(--acc);background:#161a1e}
.prow input[readonly]{color:#8d96a2;background:transparent}
.swatch{display:inline-block;width:11px;height:11px;border:1px solid #777;vertical-align:-1px;margin-right:4px}

/* ---------- layout tabs ---------- */
#ltabs{flex:none;height:23px;display:flex;align-items:stretch;gap:1px;padding:0 6px;
  background:#262a30;border-top:1px solid #16181c;font-size:11px;overflow-x:auto}
#ltabs::-webkit-scrollbar{height:4px}
#ltabs::-webkit-scrollbar-thumb{background:#4a515c}
.ltab{padding:0 12px;line-height:22px;color:var(--fg2);cursor:pointer;background:#2f343b;
  border-radius:3px 3px 0 0;white-space:nowrap;border:1px solid transparent;border-bottom:0;flex:none}
.ltab:hover{color:#fff;background:#3a4049}
.ltab.on{background:var(--panel);color:#fff;border-color:#454b55}
.ltadd{padding:0 9px;line-height:22px;color:var(--fg2);cursor:pointer;flex:none}
.ltadd:hover{color:#fff}
#ltabs .lspace{margin-left:14px;line-height:20px;color:#8fd0ff;cursor:pointer;flex:none;
  background:#2b4c6f;padding:0 10px;border-radius:2px;white-space:nowrap;align-self:center}
#ltabs .lsc{margin-left:auto;line-height:22px;color:#7b838f;padding-left:14px;white-space:nowrap;flex:none}

/* ---------- command window ---------- */
#cmdwin{flex:none;background:#1c1f24;border-top:1px solid #0f1114}
#hist{height:74px;overflow-y:auto;padding:3px 8px;font:11.5px/17px Consolas,"MS Gothic",monospace;
  color:#b6bec9;white-space:pre-wrap;word-break:break-all;
  user-select:text;-webkit-user-select:text;cursor:text}
#hist::-webkit-scrollbar{width:8px}
#hist::-webkit-scrollbar-thumb{background:#3f4650;border-radius:4px}
#hist .e{color:var(--err)} #hist .g{color:var(--ok)} #hist .c{color:#e8edf3}
#cmdrow{display:flex;align-items:center;height:24px;background:#15181c;border-top:1px solid #0d0f12;
  position:relative}
#prompt{padding:0 4px 0 8px;font:12px Consolas,monospace;color:#dfe5ec;white-space:nowrap}
#cin{flex:1;background:transparent;border:0;outline:none;color:#fff;
  font:12px Consolas,"MS Gothic",monospace;padding:0 8px 0 0;min-width:0}
#ac{position:absolute;bottom:24px;left:8px;background:#1c2026;border:1px solid #4a515c;
  min-width:260px;max-height:190px;overflow:auto;display:none;z-index:20;box-shadow:0 -4px 14px #0008}
#ac div{padding:2px 8px;font:11.5px Consolas,monospace;cursor:pointer;display:flex;gap:8px}
#ac div b{color:var(--acc2);width:62px;flex:none}
#ac div span{color:#98a1ad}
#ac div.on{background:var(--acc)}
#ac div.on b,#ac div.on span{color:#fff}

/* ---------- status bar ---------- */
#status{flex:none;height:24px;display:flex;align-items:center;gap:1px;padding:0 6px;
  background:linear-gradient(#31363d,#282c32);border-top:1px solid #0f1114;font-size:11px}
#coord{font:11.5px Consolas,monospace;color:#b9c1cb;width:190px;flex:none;padding-left:2px}
.tg{padding:2px 7px;border-radius:2px;cursor:pointer;color:#8b939e;white-space:nowrap}
.tg:hover{background:#454c57;color:#dfe5ec}
.tg.on{background:#2b4c6f;color:#8fd0ff;box-shadow:inset 0 0 0 1px #3a6c9c}
#status .sep{width:1px;height:14px;background:#4c535d;margin:0 4px}
#status .right{margin-left:auto;display:flex;align-items:center;gap:1px}

/* ---------- modal ---------- */
#mask{position:fixed;inset:0;background:#0009;display:none;z-index:50;
  align-items:center;justify-content:center}
#mask.on{display:flex}
.dlg{background:var(--panel);border:1px solid #14171b;box-shadow:0 10px 40px #000a;
  min-width:340px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column;border-radius:3px}
.dlg .hd{background:linear-gradient(#3d444d,#333a42);padding:5px 10px;font-size:12px;font-weight:600;
  border-bottom:1px solid #22262b;display:flex;justify-content:space-between;align-items:center}
.dlg .hd i{cursor:pointer;font-style:normal;color:#9aa3af}
.dlg .hd i:hover{color:#fff}
.dlg .bd{padding:10px;overflow:auto;flex:1}
.dlg .bd::-webkit-scrollbar{width:9px}
.dlg .bd::-webkit-scrollbar-thumb{background:#4a515c;border-radius:4px}
.dlg .ft{padding:8px 10px;border-top:1px solid #22262b;display:flex;gap:6px;justify-content:flex-end}
button{background:linear-gradient(#454c56,#3a4048);border:1px solid #22262b;color:#dfe5ec;
  padding:3px 14px;border-radius:3px;cursor:pointer;font:11.5px "Segoe UI","Yu Gothic UI",sans-serif}
button:hover{background:linear-gradient(#525a66,#454c56)}
button.pri{background:linear-gradient(#4a90d9,#3a76b5);border-color:#2a5a8f;color:#fff}
button.pri:hover{background:linear-gradient(#5aa0e9,#4a86c5)}
table.grid{width:100%;border-collapse:collapse;font-size:11px}
table.grid th{background:#3a4049;padding:3px 6px;text-align:left;font-weight:600;
  border:1px solid #2a2e34;position:sticky;top:0;white-space:nowrap}
table.grid td{padding:1px 6px;border:1px solid #31363d;white-space:nowrap}
table.grid tr.on td{background:#2b4c6f}
table.grid tr:hover td{background:#3b424b}
table.grid tr.on:hover td{background:#33587e}
table.grid td input[type=text]{background:transparent;border:1px solid transparent;color:#e2e7ed;
  width:100%;font:11px Consolas,monospace;padding:0 2px}
table.grid td input[type=text]:focus{background:#161a1e;border-color:var(--acc);outline:none}
.ic{cursor:pointer;display:inline-block;width:16px;text-align:center}
.fld{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.fld label{width:120px;flex:none;color:#aeb6c1;font-size:11px}
.fld input[type=text],.fld input[type=number],.fld select{flex:1;background:#22262b;
  border:1px solid #464d57;color:#e2e7ed;padding:2px 5px;font:11.5px Consolas,monospace;border-radius:2px}
.fld input:focus,.fld select:focus{border-color:var(--acc);outline:none}
.chk{display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:11.5px;cursor:pointer}
.chk input{accent-color:var(--acc)}
fieldset{border:1px solid #454b55;border-radius:3px;padding:8px 10px;margin:0 0 10px}
legend{color:#aeb6c1;font-size:11px;padding:0 5px}
.colors{display:grid;grid-template-columns:repeat(20,16px);gap:2px}
.colors div{width:16px;height:16px;border:1px solid #222;cursor:pointer}
.colors div:hover{outline:2px solid #fff;z-index:1}
.colors div.on{outline:2px solid var(--acc2);z-index:1}
.hint{color:#7b838f;font-size:10.5px;margin-top:6px;line-height:1.6}

/* right click menu */
#cmenu{position:absolute;z-index:40;background:#2b3038;border:1px solid #14171b;
  box-shadow:0 6px 22px #0009;display:none;min-width:170px;padding:3px 0;border-radius:3px}
#cmenu div{padding:3px 22px 3px 14px;font-size:11.5px;cursor:pointer;display:flex;justify-content:space-between}
#cmenu div:hover{background:var(--acc);color:#fff}
#cmenu div.dis{color:#6b737e;pointer-events:none}
#cmenu hr{border:0;border-top:1px solid #444a54;margin:3px 0}
</style>
</head>
<body>
<div id="app">
  <div id="qat">
    <div class="brand">CAD<b>なんです</b><span class="ver" id="verlbl"></span></div>
    <div class="qbtn" data-cmd="NEW" title="新規 (Ctrl+N)"></div>
    <div class="qbtn" data-cmd="OPEN" title="開く (Ctrl+O)"></div>
    <div class="qbtn" data-cmd="QSAVE" title="保存 (Ctrl+S)"></div>
    <div class="sep"></div>
    <div class="qbtn" data-cmd="U" title="元に戻す (Ctrl+Z)"></div>
    <div class="qbtn" data-cmd="REDO" title="やり直し (Ctrl+Y)"></div>
    <div class="sep"></div>
    <div class="qbtn" data-cmd="PLOT" title="印刷 (Ctrl+P)"></div>
    <div class="fname" id="fname">Drawing1.jcad</div>
  </div>

  <div id="ribbon">
    <div id="rtabs"><span id="rmin" title="リボンを最小化（アクティブなタブのクリックでも切替）">&#9650;</span></div>
    <div id="rpanels"></div>
  </div>

  <div id="main">
    <div id="cvwrap">
      <canvas id="cv"></canvas>
      <div id="dyn"></div>
      <div id="tooltip"></div>
      <div id="cmenu"></div>
      <div id="drop">図面ファイルをドロップして開く</div>
    </div>
    <div id="props">
      <h3><span>プロパティ</span><i id="propclose" title="閉じる">✕</i></h3>
      <div id="propbody"></div>
    </div>
  </div>

  <div id="ltabs"></div>

  <div id="cmdwin">
    <div id="hist"></div>
    <div id="cmdrow">
      <span id="prompt">コマンド:</span>
      <input id="cin" autocomplete="off" spellcheck="false">
      <div id="ac"></div>
    </div>
  </div>

  <div id="status">
    <span id="coord">0.0000, 0.0000</span>
    <span class="sep"></span>
    <span class="tg" data-tg="gridSnap" title="スナップ モード (F9)">スナップ</span>
    <span class="tg" data-tg="grid" title="グリッド表示 (F7)">グリッド</span>
    <span class="tg" data-tg="ortho" title="直交モード (F8)">直交</span>
    <span class="tg" data-tg="polar" title="極トラッキング (F10)">極</span>
    <span class="tg" data-tg="osnap" title="オブジェクト スナップ (F3)">OSNAP</span>
    <span class="tg" data-tg="otrack" title="オブジェクト スナップ トラッキング (F11)">OTRACK</span>
    <span class="tg" data-tg="dyn" title="ダイナミック入力 (F12)">DYN</span>
    <span class="tg" data-tg="lwt" title="線の太さを表示">線の太さ</span>
    <span class="sep"></span>
    <span class="tg" data-cmd="OSNAP" title="スナップ設定">⚙</span>
    <span class="right">
      <span class="tg" data-cmd="ZOOM_E" title="図面全体ズーム">全体</span>
      <span class="tg" data-cmd="PROPS" title="プロパティ (Ctrl+1)">プロパティ</span>
      <span class="tg" id="entcount">0 オブジェクト</span>
    </span>
  </div>
</div>

<div id="mask"></div>

<script>
/* ============================================================================
   CADなんです  —  Part 1 : 幾何コア / ドキュメントモデル
   ========================================================================== */
'use strict';

const JCAD_VERSION = '1.1.1';
const JCAD_BUILD    = '2026-09-11';

/* ---------- 体験版 ----------
   体験版ビルドはこの行を true にして、別ファイル（cadnandesu-trial.html）として配布する。
   生成は _dev/build-trial.js。単体HTMLなので書き換えられるが、これは保護ではなく「試用の設計」。
   止めるのは “描いたものを外に持ち出す” 機能だけ。描く・編集する・開く・印刷するは制限しない。 */
const TRIAL = true;   /* ← 体験版ビルドはここを true */

const TRIAL_MSG = {

      for (let i=0;i<ents.length;i++) for (let j=i+1;j<ents.length;j++) {
        const ps = entInter(ents[i], ents[j]);
        ps.forEach(q => { if (dist(q,p) <= ap) cand.push({p:q, ent:ents[i]}); });
      }
    } else if (type === 'per') {
      if (!base) continue;
      ents.forEach(e => { entSegs(e).forEach(s => {
        let q = null;
        if (s.t === 'l') { const d = sub(s.b,s.a), L = dot(d,d)||1;
          const t = dot(sub(base,s.a),d)/L; if (t>=-.001&&t<=1.001) q = segAt(s,t); }
        else { const d = sub(base, s.c); if (vlen(d) > 1e-9) {
          const q1 = add(s.c, mul(norm(d), s.r));
          if (s.full || (segParam(s,q1)>=0 && segParam(s,q1)<=1)) q = q1;
          const q2 = add(s.c, mul(norm(d), -s.r));
          if (q && dist(q2,p) < dist(q,p) && (s.full || (segParam(s,q2)>=0&&segParam(s,q2)<=1))) q = q2;
        }}
        if (q && dist(q,p) <= ap) cand.push({p:q, ent:e}); }); });
    } else if (type === 'tan') {
      if (!base) continue;
      ents.forEach(e => { entSegs(e).forEach(s => { if (s.t !== 'a') return;
        const d = dist(base, s.c); if (d <= s.r + 1e-9) return;
        const a0 = angOf(s.c, base), da = Math.acos(s.r/d);
        [a0+da, a0-da].forEach(a => { const q = onCir(s.c,s.r,a);
          if ((s.full || (segParam(s,q)>=0&&segParam(s,q)<=1)) && dist(q,p)<=ap) cand.push({p:q,ent:e}); });
      }); });
    } else if (type === 'nea') {
      ents.forEach(e => { entSegs(e).forEach(s => { const q = segClosest(s, p);
        if (dist(q,p) <= ap) cand.push({p:q, ent:e}); }); });
    } else {
      ents.forEach(e => snapCandidates(e, type).forEach(q => {
        if (dist(q,p) <= ap) cand.push({p:q, ent:e}); }));
    }
    if (cand.length) {
      cand.sort((a,b2) => dist(a.p,p) - dist(b2.p,p));
      best = { p: cand[0].p, type, ent: cand[0].ent }; break;
    }
  }
  snapHit = best;
  return best;
}

/* ---------- 極トラッキング / 直交 ---------- */
function applyOrtho(p, base) {
  trackLines = [];
  if (!base) return p;
  const d = sub(p, base);
  if (cfg.ortho) {
    const q = Math.abs(d[0]) >= Math.abs(d[1]) ? [base[0]+d[0], base[1]] : [base[0], base[1]+d[1]];
    trackLines.push([base, q]);
    return q;
  }
  if (cfg.polar) {
    const L = vlen(d); if (L < 1e-9) return p;
    const inc = cfg.polarAng*D2R;
    const a = Math.atan2(d[1], d[0]);
    const k = Math.round(a/inc)*inc;
    if (Math.abs(na(a-k)) < 0.12 || Math.abs(na(a-k)-TAU) < 0.12) {
      const q = add(base, [L*Math.cos(k), L*Math.sin(k)]);
      const far = add(base, [Math.max(cvW,cvH)/view.scale*Math.cos(k), Math.max(cvW,cvH)/view.scale*Math.sin(k)]);
      trackLines.push([add(base, mul([Math.cos(k),Math.sin(k)], -1e5/view.scale)), far]);
      return q;
    }
  }
  return p;
}
function gridSnapPt(p) {
  if (!cfg.gridSnap || cfg.snapStep <= 0) return p;
  return [Math.round(p[0]/cfg.snapStep)*cfg.snapStep, Math.round(p[1]/cfg.snapStep)*cfg.snapStep];
}
/** 画面座標 → 実際に採用する作図点 */
function resolvePoint(px, base) {
  let p = s2w(px);
  const hit = findSnap(p, base);
  if (hit) { trackLines = []; scheduleAcq(hit.p); return hit.p; }
  cancelAcq();
  const tr = trackSnap(p, base);          /* OTRACK: 取得点からの延長線に乗せる */
  if (tr) { trackLines = tr.lines; return tr.p; }
  p = gridSnapPt(p);
  p = applyOrtho(p, base);
  return p;
}

/* ============================================================================
   入力エンジン
   ========================================================================== */
let inp = null;           // 現在の入力待ち
let cmdActive = null;     // 実行中コマンド名
let lastCmd = '';
let inputHist = [], histIdx = -1;

const $ = id => document.getElementById(id);
const cin = $('cin'), promptEl = $('prompt'), histEl = $('hist');

function print(s, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = s;
  histEl.appendChild(d);
  while (histEl.childNodes.length > 400) histEl.removeChild(histEl.firstChild);
  histEl.scrollTop = histEl.scrollHeight;
}
function setPrompt(s) { promptEl.textContent = s; }

function kwStr(kw) { return kw ? ' [' + Object.keys(kw).map(k => kw[k]).join('/') + ']' : ''; }

function ask(kind, prompt, opts) {
  opts = opts || {};
  endInput();
  return new Promise((res, rej) => {
    inp = { kind, prompt, opts, resolve: res, reject: rej };
    setPrompt(prompt + kwStr(opts.kw) + (opts.def !== undefined ? ' <' + opts.def + '>' : '') + ': ');
    cin.value = ''; cin.focus(); draw();
  });
}
function endInput() { inp = null; trackLines = []; dragWin = null; }
function finish(v) { const i = inp; endInput(); setPrompt('コマンド: '); if (i) i.resolve(v); draw(); }
function cancelInput() { const i = inp; endInput(); if (i) i.reject(CANCEL); }
function pvRect(a, b) { pvPoly([a, [b[0],a[1]], b, [a[0],b[1]]], true); }

const getPoint = (p, o) => ask('point', p, o);
const getDist  = (p, o) => ask('dist',  p, o);
const getReal  = (p, o) => ask('real',  p, o);
const getInt   = (p, o) => ask('int',   p, o);
const getStr   = (p, o) => ask('str',   p, o);
const getKw    = (p, o) => ask('kw',    p, o);
const getAngle = (p, o) => ask('angle', p, o);
const getEnt   = (p, o) => ask('ent',   p, o);

function getSel(prompt, opts) {
  opts = opts || {};
  if (!opts.keep) { }
  return ask('sel', prompt || 'オブジェクトを選択', opts);
}

/* ---------- 座標文字列パース ---------- */
function parseCoord(t, base) {
  t = t.trim().replace(/[，、]/g, ',').replace(/＜/g, '<').replace(/＠/g, '@');
  let rel = false;
  if (t[0] === '@') { rel = true; t = t.slice(1); }
  let p = null;
  if (t.includes('<')) {
    const [d, a] = t.split('<');
    const D = evalNum(d), A = evalNum(a);
    if (D === null || A === null) return null;
    p = [D*Math.cos(A*D2R), D*Math.sin(A*D2R)];
    if (!rel) return p;
    return base ? add(base, p) : p;
  }
  if (t.includes(',')) {
    const parts = t.split(',');
    const x = evalNum(parts[0]), y = evalNum(parts[1]);
    if (x === null || y === null) return null;
    p = [x,y];
    return rel ? (base ? add(base, p) : p) : p;
  }
  return null;
}
function evalNum(s) {
  s = String(s).trim().replace(/[０-９．＋－＊／（）]/g,
      c => '0123456789.+-*/()'['０１２３４５６７８９．＋－＊／（）'.indexOf(c)]);
  if (!s) return null;
  if (!/^[-+*/().0-9eE\s]+$/.test(s)) return null;
  try { const v = Function('"use strict";return (' + s + ')')(); return isFinite(v) ? v : null; }
  catch (e) { return null; }
}
function matchKw(t, kw) {
  if (!kw) return null;
  const T = t.toUpperCase();
  for (const k in kw) if (k === T || kw[k].toUpperCase() === T) return k;
  for (const k in kw) if (k.startsWith(T) && T.length) return k;
  return null;
}

/* ---------- コマンドライン キー処理 ---------- */
cin.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { ev.preventDefault(); doEscape(); return; }
  if (ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
    if ($('ac').style.display === 'block') { moveAc(ev.key === 'ArrowDown' ? 1 : -1); ev.preventDefault(); return; }
    ev.preventDefault();
    if (!inputHist.length) return;
    histIdx = ev.key === 'ArrowUp' ? Math.max(0, (histIdx < 0 ? inputHist.length : histIdx) - 1)
                                   : Math.min(inputHist.length, histIdx + 1);
    cin.value = inputHist[histIdx] || ''; return;
  }
  if (ev.key === 'Tab') { ev.preventDefault(); if (acSel >= 0) applyAc(); return; }
  /* AutoCAD と同じく Space は Enter として働く（文字列入力中を除く） */
  if (ev.key === 'Enter' || (ev.key === ' ' && shouldSpaceEnter())) {
    ev.preventDefault();
    if ($('ac').style.display === 'block' && acSel >= 0) applyAc();
    submit(cin.value);
  }
});
function shouldSpaceEnter() { return !inp || inp.kind !== 'str'; }
cin.addEventListener('input', () => { updateAc(); histIdx = -1; });
cin.addEventListener('blur', () => setTimeout(() => { $('ac').style.display = 'none'; }, 150));

function submit(text) {
  const t = text.trim();
  $('ac').style.display = 'none';
  cin.value = '';
  if (!inp) {                                   /* コマンド入力 */
    if (t === '') { if (lastCmd) runCmd(lastCmd); return; }
    inputHist.push(t); if (inputHist.length > 200) inputHist.shift();
    print('コマンド: ' + t, 'c');
    runCmd(t);
    return;
  }
  const o = inp.opts;
  print(inp.prompt + ': ' + t);
  /* キーワード優先 */
  const k = matchKw(t, o.kw);
  if (k) { finish({ kw: k }); return; }
  if (t === '') {
    if (o.def !== undefined) { finish(o.defVal !== undefined ? o.defVal : o.def); return; }
    if (inp.kind === 'sel' || o.allowEmpty) { finish(inp.kind === 'sel' ? sel.slice() : null); return; }
    finish(null); return;
  }
  switch (inp.kind) {
    case 'point': case 'dist': {
      const p = parseCoord(t, o.base);
      if (p) { finish(p); return; }
      const v = evalNum(t);
      if (v !== null) {
        if (inp.kind === 'dist') { finish(v); return; }
        if (o.base) {                                  /* 直接距離入力 */
          const d = norm(sub(applyOrtho(cursor, o.base), o.base));
          if (vlen(d) > 0) { finish(add(o.base, mul(d, v))); return; }
        }
      }
      print('点が無効です。', 'e'); reAsk(); return;
    }
    case 'real': case 'int': {
      const v = evalNum(t);
      if (v === null) { print('数値が無効です。', 'e'); reAsk(); return; }
      finish(inp.kind === 'int' ? Math.round(v) : v); return;
    }
    case 'angle': {
      const v = evalNum(t);
      if (v !== null) { finish(v*D2R); return; }
      const p = parseCoord(t, o.base);
      if (p && o.base) { finish(angOf(o.base, p)); return; }
      print('角度が無効です。', 'e'); reAsk(); return;
    }
    case 'str': finish(t); return;
    case 'kw': {
      print('無効な入力です。', 'e'); reAsk(); return;
    }
    case 'sel': {
      const T = t.toUpperCase();
      if (T === 'ALL' || T === 'A') { addSel(ents().filter(editable)); reAsk(); return; }
      if (T === 'L') { const e = ents().filter(editable).pop(); if (e) addSel([e]); reAsk(); return; }
      if (T === 'P') { addSel(prevSel.filter(e => ents().includes(e))); reAsk(); return; }
      if (T === 'R') { inp.remove = true; print('オブジェクトを除去'); reAsk(); return; }
      print('選択方法: ALL / L(最後) / P(直前) / R(除去) / Enter(確定)', 'e'); reAsk(); return;
    }
    case 'ent': { print('オブジェクトをクリックしてください。', 'e'); reAsk(); return; }
  }
}
function reAsk() {
  if (!inp) return;
  setPrompt(inp.prompt + kwStr(inp.opts.kw) + (inp.opts.def !== undefined ? ' <' + inp.opts.def + '>' : '') + ': ');
  cin.focus();
}
function doEscape() {
  $('ac').style.display = 'none';
  clearTrack();
  if (inp) { print('*キャンセル*'); cancelInput(); setPrompt('コマンド: '); }
  else if (sel.length) { clearSel(); }
  cin.value = ''; draw();
}

/* ---------- 選択管理 ---------- */
function clearSel() { sel = []; grips = []; hotGrip = null; updateProps(); draw(); }
function addSel(list) {
  list.forEach(e => { if (editable(e) && !sel.includes(e)) sel.push(e); });
  rebuildGrips(); updateProps();
  if (inp && inp.kind === 'sel') print(list.length + ' 個を検出   合計 ' + sel.length + ' 個');
  draw();
}
function removeSel(list) { list.forEach(e => { const i = sel.indexOf(e); if (i>=0) sel.splice(i,1); });
  rebuildGrips(); updateProps(); draw(); }
function toggleSel(e, shift) {
  if (shift) { if (sel.includes(e)) removeSel([e]); else addSel([e]); }
  else addSel([e]);
}
function pickAt(px, one) {
  const p = s2w(px), tol = s2wd(cfg.pickbox + 2);
  const pool = ents();
  const hits = pool.filter(e => editable(e) && entHit(e, p, tol));
  hits.sort((a,b) => pool.indexOf(b) - pool.indexOf(a));
  return one ? (hits[0] || null) : hits;
}
function rebuildGrips() {
  grips = [];
  if (sel.length > 60) return;
  sel.forEach(e => gripPts(e).forEach((p,i) => grips.push({ e, i, p })));
}
function gripPts(e) {
  switch (e.type) {
    case 'line': return [e.p1, midp(e.p1,e.p2), e.p2];
    case 'pline': case 'spline': return e.pts.slice();
    case 'circle': return [e.c, onCir(e.c,e.r,0), onCir(e.c,e.r,Math.PI/2),
                           onCir(e.c,e.r,Math.PI), onCir(e.c,e.r,-Math.PI/2)];
    case 'arc': return [e.c, onCir(e.c,e.r,e.a1), onCir(e.c,e.r,e.a2),
                        onCir(e.c,e.r,e.a1 + na(e.a2-e.a1)/2)];
    case 'ellipse': return [e.c, add(e.c,e.major), sub(e.c,e.major)];
    case 'point': return [e.p];
    case 'text': case 'mtext': case 'insert': case 'xref': case 'attdef': return [e.p];
    case 'dim': { if (e.dtype === 'leader') return e.pts.slice();
                  const g=[e.p1,e.p2,e.dp,e.tp].filter(Boolean); if(e.c)g.push(e.c); return g; }
    case 'hatch': return [];
    case 'viewport': return [[e.p[0]-e.w/2, e.p[1]-e.h/2], [e.p[0]+e.w/2, e.p[1]-e.h/2],
                             [e.p[0]+e.w/2, e.p[1]+e.h/2], [e.p[0]-e.w/2, e.p[1]+e.h/2], e.p];
    default: return [];
  }
}
function moveGrip(e, i, p) {
  switch (e.type) {
    case 'line': if (i===0) e.p1=p; else if (i===2) e.p2=p;
                 else { const d=sub(p,midp(e.p1,e.p2)); e.p1=add(e.p1,d); e.p2=add(e.p2,d); } break;
    case 'pline': case 'spline': e.pts[i] = p; break;
    case 'circle': if (i===0) e.c=p; else e.r = Math.max(1e-9, dist(e.c,p)); break;
    case 'arc': if (i===0) e.c=p; else if (i===1) { e.a1=angOf(e.c,p); }
                else if (i===2) { e.a2=angOf(e.c,p); } else e.r=Math.max(1e-9,dist(e.c,p)); break;
    case 'ellipse': if (i===0) e.c=p; else e.major = i===1 ? sub(p,e.c) : sub(e.c,p); break;
    case 'point': e.p = p; break;
    case 'text': case 'mtext': case 'insert': case 'xref': case 'attdef': e.p = p; break;
    case 'dim': {
      if (e.dtype === 'leader') { e.pts[i] = p; break; }
      const keys = ['p1','p2','dp','tp']; const has = keys.filter(k=>e[k]);
      const k = has[i]; if (k) e[k] = p;
      else if (e.c) e.c = p;
      break;
    }
    case 'viewport': {
      if (i === 4) { e.p = p; break; }
      const c = [[-1,-1],[1,-1],[1,1],[-1,1]][i];
      const opp = [e.p[0] - c[0]*e.w/2, e.p[1] - c[1]*e.h/2];
      e.w = Math.max(1, Math.abs(p[0]-opp[0])); e.h = Math.max(1, Math.abs(p[1]-opp[1]));
      e.p = [(p[0]+opp[0])/2, (p[1]+opp[1])/2];
      break;
    }
  }
}

/* ---------- Undo ---------- */
function snap(label) {
  undoStack.push({ label, s: JSON.stringify({ e: doc.entities, l: doc.layers, b: doc.blocks,
                    n: nextId, L: doc.layouts, D: doc.dimstyles, X: doc.xrefs }) });
  if (undoStack.length > 120) undoStack.shift();
  redoStack.length = 0;
  markDirty();
}
function restore(str) {
  const o = JSON.parse(str);
  doc.entities = o.e; doc.layers = o.l; doc.blocks = o.b; nextId = o.n;
  if (o.L) doc.layouts = o.L;
  if (o.D) doc.dimstyles = o.D;
  if (o.X) doc.xrefs = o.X;
  if (!doc.layouts.length) doc.layouts = [mkLayout('レイアウト1','A3',true)];
  if (doc.space >= doc.layouts.length) { doc.space = -1; doc.avpId = null; }
  if (!curVP()) doc.avpId = null;
  sel = []; grips = []; updateProps(); refreshLayerUI(); buildLayoutTabs(); draw();
}
function undo() {
  if (!undoStack.length) { print('元に戻す対象がありません。', 'e'); return; }
  const cur = JSON.stringify({ e: doc.entities, l: doc.layers, b: doc.blocks, n: nextId });
  const s = undoStack.pop();
  redoStack.push({ label: s.label, s: cur });
  restore(s.s); print(s.label + ' を元に戻しました');
}
function redo() {
  if (!redoStack.length) { print('やり直す対象がありません。', 'e'); return; }
  const cur = JSON.stringify({ e: doc.entities, l: doc.layers, b: doc.blocks, n: nextId });
  const s = redoStack.pop();
  undoStack.push({ label: s.label, s: cur });
  restore(s.s); print(s.label + ' をやり直しました');
}

<script>
/* ============================================================================
   CADなんです  —  Part 3 : マウス / ダイナミック入力 / 編集アルゴリズム
   ========================================================================== */

/* ---------- ダイナミック入力 ---------- */
const dynEl = $('dyn');
function updateDyn() {
  if (!cfg.dyn || !inCanvas || !inp || (inp.kind !== 'point' && inp.kind !== 'dist')) {
    dynEl.style.display = 'none'; return;
  }
  const b = inp.opts.base;
  let html = '';
  if (b) {
    const d = sub(cursor, b);
    html = '<span class="box act">' + fmt(vlen(d)) + '</span><span class="box">' + fmtA(Math.atan2(d[1],d[0])) + '</span>';
  } else {
    html = '<span class="box act">' + fmt(cursor[0]) + '</span><span class="box">' + fmt(cursor[1]) + '</span>';
  }
  html += '<span class="tip">' + inp.prompt + kwStr(inp.opts.kw) + '</span>';
  dynEl.innerHTML = html;
  dynEl.style.display = 'block';
  dynEl.style.left = (cursorPx[0] + 16) + 'px';
  dynEl.style.top  = (cursorPx[1] + 16) + 'px';
}
function showTip(txt) {
  const t = $('tooltip');
  if (!txt) { t.style.display = 'none'; return; }
  t.textContent = txt; t.style.display = 'block';
  t.style.left = (cursorPx[0] + 18) + 'px'; t.style.top = (cursorPx[1] - 22) + 'px';
}

/* ---------- マウス ---------- */
function evPx(ev) { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }

cv.addEventListener('mouseenter', () => { inCanvas = true; draw(); });
cv.addEventListener('mouseleave', () => { inCanvas = false; dynEl.style.display='none'; showTip(''); draw(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('mousemove', ev => {
  cursorPx = evPx(ev);
  if (panning) {
    const d = [cursorPx[0]-panning[0], cursorPx[1]-panning[1]];
    view.cx -= d[0]/view.scale; view.cy += d[1]/view.scale;
    panning = cursorPx.slice(); draw(); return;
  }
  const base = inp && inp.opts ? inp.opts.base : null;
  cursor = resolvePoint(cursorPx, base);
  $('coord').textContent = fmt(cursor[0]) + ', ' + fmt(cursor[1]) +
     (base ? '   ' + fmt(dist(base,cursor)) + '<' + fmtA(angOf(base,cursor)) : '');
  if (dragWin) {
    dragWin.p1 = s2w(cursorPx);
    dragWin.mode = (cursorPx[0] >= dragWin.px0) ? 'w' : 'c';
  }
  /* グリップ ホバー */
  let hov = false;
  grips.forEach(g => { const s = w2s(g.p);
    const h = Math.abs(s[0]-cursorPx[0]) <= 5 && Math.abs(s[1]-cursorPx[1]) <= 5;
    if (h !== g.hover) hov = true; g.hover = h; });
  showTip(snapHit ? SNAPLABEL[snapHit.type] : '');
  updateDyn(); draw();
});

cv.addEventListener('mousedown', ev => {
  cin.focus();
  const px = evPx(ev);
  hideMenu();
  if (ev.button === 1) { panning = px; ev.preventDefault(); return; }
  if (ev.button === 2) {
    if (inp) { submit(''); } else showMenu(px);
    return;
  }
  /* 左ボタン */
  if (inp) {
    if (inp.kind === 'point' || inp.kind === 'dist' || inp.kind === 'angle') {
      const p = resolvePoint(px, inp.opts.base);
      print(inp.prompt + ': ' + fmtP(p));
      finish(p);
      return;
    }
    if (inp.kind === 'ent') {
      const hits = pickAt(px, false).filter(e => !inp.opts.filter || inp.opts.filter(e));
      if (!hits.length) { print('見つかりません。', 'e'); return; }
      finish({ ent: hits[0], p: s2w(px) });
      return;
    }
    if (inp.kind === 'sel') {

  const closed = Math.hypot(pts[0][0]-pts[pts.length-1][0], pts[0][1]-pts[pts.length-1][1]) < 1e-9;
  if (closed) {                       /* 始点=終点だと分割できないので最遠点で二分する */
    let far = 0, fd = -1;
    for (let i = 1; i < pts.length-1; i++) {
      const d = Math.hypot(pts[i][0]-pts[0][0], pts[i][1]-pts[0][1]);
      if (d > fd) { fd = d; far = i; }
    }
    if (far > 0) { keep[far] = 1; st.push([0,far],[far,pts.length-1]); }
    else st.push([0, pts.length-1]);
  } else st.push([0, pts.length-1]);
  while (st.length) {
    const [a,b] = st.pop(); if (b - a < 2) continue;
    let mi = -1, md = 0;
    const A = pts[a], B = pts[b], dx = B[0]-A[0], dy = B[1]-A[1];
    const L = Math.hypot(dx,dy) || 1;
    for (let i = a+1; i < b; i++) {
      const d = Math.abs((pts[i][0]-A[0])*dy - (pts[i][1]-A[1])*dx) / L;
      if (d > md) { md = d; mi = i; }
    }
    if (md > eps && mi > 0) { keep[mi] = 1; st.push([a,mi],[mi,b]); }
  }
  return pts.filter((p,i) => keep[i]);
}
function polyArea(pts) {
  let a = 0;
  for (let i = 0, j = pts.length-1; i < pts.length; j = i++) a += (pts[j][0]+pts[i][0])*(pts[j][1]-pts[i][1]);
  return Math.abs(a/2);
}
function polyPerim(pts, closed) {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += dist(pts[i-1], pts[i]);
  if (closed && pts.length > 2) L += dist(pts[pts.length-1], pts[0]);
  return L;
}
function entLength(e) {
  if (e.type === 'circle') return TAU * e.r;
  return entSegs(e).reduce((a,s) => a + segLen(s), 0);
}
function entArea(e) {
  if (e.type === 'circle') return Math.PI*e.r*e.r;
  if (e.type === 'hatch') return e.loops.reduce((a,l,i) => a + (i ? -1 : 1)*polyArea(l), 0);
  if (!entClosed(e)) return polyArea(entPolyline(e));
  return polyArea(entPolyline(e));
}

<script>
/* ============================================================================
   CADなんです  —  Part 4 : コマンド
   ========================================================================== */
const CMD = {}, ALIAS = {};
const isKw = r => !!(r && r.kw);
function def(names, hint, run) {
  const list = names.split(',').map(s => s.trim().toUpperCase());
  const main = list[0];
  CMD[main] = { run, hint, name: main };
  list.slice(1).forEach(a => ALIAS[a] = main);
}

async function runCmd(raw) {
  let t = String(raw || '').trim();
  if (!t) return;
  if (t[0] === "'" || t[0] === '_') t = t.slice(1);
  const parts = t.split(/\s+/);
  let name = parts[0].toUpperCase();
  if (ALIAS[name]) name = ALIAS[name];
  const c = CMD[name];
  if (!c) { print('不明なコマンド "' + parts[0] + '"。「?」でコマンド一覧。', 'e');
            setPrompt('コマンド: '); return; }
  if (inp) cancelInput();
  cmdActive = name;
  if (!['U','UNDO','REDO','ZOOM','PAN','PROPS','LAYER','OSNAP','HELP'].includes(name)) lastCmd = name;
  try { await c.run(parts.slice(1)); }
  catch (err) {
    if (err !== CANCEL) { console.error(err); print('エラー: ' + (err && err.message || err), 'e'); }
  }
  cmdActive = null; endInput(); clearTrack(); setPrompt('コマンド: '); cin.focus();
  updateProps(); draw();
}

/* ---------- 共通ヘルパ ---------- */
async function needSel(prompt, filter) {
  if (sel.length) { const s = sel.filter(e => !filter || filter(e)); if (s.length) return s; }
  clearSel();
  const r = await getSel(prompt || 'オブジェクトを選択', { filter });
  const s = (r || []).filter(e => !filter || filter(e));
  if (!s.length) throw CANCEL;
  return s;
}
async function askDist(prompt, base, dflt, kw) {
  const r = await getDist(prompt, { base, def: dflt, kw,
    preview: base ? (cur => pvLine(base, cur)) : undefined });
  if (isKw(r)) return r;
  if (r === null || r === undefined) return dflt;
  return Array.isArray(r) ? dist(base, r) : r;
}
async function askAngle(prompt, base, dflt, kw) {
  const r = await getAngle(prompt, { base, kw, defVal: dflt,
    def: dflt === undefined ? undefined : fmt(dflt*R2D,2),
    preview: base ? (cur => pvLine(base, cur)) : undefined });
  if (isKw(r)) return r;
  if (r === null || r === undefined) return dflt || 0;
  return Array.isArray(r) ? angOf(base, r) : r;
}
function commit(label, fn) { snap(label); fn(); prevSel = sel.slice(); clearSel(); draw(); markDirty(); }
function circum(a,b,c) {
  const d = 2*(a[0]*(b[1]-c[1]) + b[0]*(c[1]-a[1]) + c[0]*(a[1]-b[1]));
  if (Math.abs(d) < 1e-12) return null;
  const ux = ((a[0]*a[0]+a[1]*a[1])*(b[1]-c[1]) + (b[0]*b[0]+b[1]*b[1])*(c[1]-a[1]) + (c[0]*c[0]+c[1]*c[1])*(a[1]-b[1]))/d;
  const uy = ((a[0]*a[0]+a[1]*a[1])*(c[0]-b[0]) + (b[0]*b[0]+b[1]*b[1])*(a[0]-c[0]) + (c[0]*c[0]+c[1]*c[1])*(b[0]-a[0]))/d;
  return [ux,uy];
}

/* ============================================================================
   作成コマンド
   ========================================================================== */
def('LINE, L', '線分', async () => {
  let p0 = await getPoint('1点目を指定');
  if (isKw(p0) || !p0) return;
  const first = p0; let prev = p0, made = [], started = false;
  while (true) {
    let r;
    try {
      r = await getPoint('次の点を指定', { base: prev,
        kw: made.length >= 1 ? { C:'閉じる(C)', U:'元に戻す(U)' } : { U:'元に戻す(U)' },
        preview: cur => pvLine(prev, cur) });
    } catch (e) { break; }
    if (r === null) break;
    if (isKw(r)) {
      if (r.kw === 'C' && made.length) {
        if (!started) { snap('線分'); started = true; }
        addEnt(mkEnt('line', { p1: prev, p2: first })); break;
      }
      if (r.kw === 'U' && made.length) {
        delEnt(made.pop()); prev = made.length ? made[made.length-1].p2 : first; draw(); continue;
      }
      continue;
    }
    if (!started) { snap('線分'); started = true; }
    made.push(addEnt(mkEnt('line', { p1: prev, p2: r }))); prev = r; draw();
  }
});

def('PLINE, PL', 'ポリライン', async () => {
  let p0 = await getPoint('始点を指定');
  if (isKw(p0) || !p0) return;
  const pts = [p0], bul = []; let arcMode = false, started = false, ent = null;
  const kwL = { A:'円弧(A)', C:'閉じる(C)', U:'元に戻す(U)' };
  const kwA = { L:'線分(L)', C:'閉じる(C)', U:'元に戻す(U)', R:'半径(R)' };
  const flush = () => { if (pts.length < 2) return;
    if (!started) { snap('ポリライン'); started = true; ent = addEnt(mkEnt('pline', { pts:[], bulge:[], closed:false })); }
    ent.pts = pts.slice(); ent.bulge = bul.slice(); draw(); };
  while (true) {
    const prev = pts[pts.length-1];
    let r;
    try {
      r = await getPoint(arcMode ? '円弧の端点を指定' : '次の点を指定',
        { base: prev, kw: arcMode ? kwA : kwL,
          preview: cur => {
            if (!arcMode) pvLine(prev, cur);
            else { const b = plineArcBulge(pts, bul, prev, cur);
                   const a = bulgeToArc(prev, cur, b); if (a) pvArc(a.c, a.r, a.ccw?a.s:a.e, a.ccw?a.e:a.s); else pvLine(prev,cur); }
            pvPoly(pts.concat([cur]), false); } });
    } catch (e) { break; }
    if (r === null) break;
    if (isKw(r)) {
      if (r.kw === 'A') { arcMode = true; continue; }
      if (r.kw === 'L') { arcMode = false; continue; }
      if (r.kw === 'U') { if (pts.length > 1) { pts.pop(); bul.pop(); flush(); } continue; }
      if (r.kw === 'C') { if (pts.length > 2) { flush(); if (ent) { ent.closed = true;
          ent.bulge = bul.concat([arcMode ? plineArcBulge(pts,bul,pts[pts.length-1],pts[0]) : 0]); } } break; }
      if (r.kw === 'R') { const rr = await askDist('円弧の半径を指定', prev, 1);
        if (typeof rr === 'number') { /* 半径指定はプレビュー簡略 */ } continue; }
      continue;
    }
    bul.push(arcMode ? plineArcBulge(pts, bul, prev, r) : 0);
    pts.push(r); flush();
  }
  if (ent) { ent.pts = pts; ent.bulge = bul; if (pts.length < 2) delEnt(ent); }
  draw();
});
/** 直前セグメントに接する円弧のバルジを求める */
function plineArcBulge(pts, bul, prev, cur) {
  if (pts.length < 2) return 0.5;
  const i = pts.length - 2;
  const pp = pts[i], b0 = bul[i] || 0;
  let tang;
  if (Math.abs(b0) > 1e-9) { const a = bulgeToArc(pp, prev, b0); tang = segTangent(a, 1); }
  else tang = norm(sub(prev, pp));
  const ch = sub(cur, prev);
  const th = 2 * Math.atan2(cross(tang, ch), dot(tang, ch));
  const b = Math.tan(th/4);
  return isFinite(b) ? b : 0;
}

def('CIRCLE, C', '円', async () => {
  const r0 = await getPoint('円の中心点を指定', { kw: { '3P':'3点(3P)', '2P':'2点(2P)', T:'接接半(T)' } });
  if (r0 === null) return;
  let e = null;
  if (isKw(r0)) {
    if (r0.kw === '3P') {
      const a = await getPoint('円周上の1点目'); const b = await getPoint('円周上の2点目', { base:a });
      const c = await getPoint('円周上の3点目', { base:b, preview: cur => { const C = circum(a,b,cur); if (C) pvCircle(C, dist(C,a)); } });
      const C = circum(a,b,c); if (!C) { print('円を作成できません。', 'e'); return; }
      e = mkEnt('circle', { c:C, r:dist(C,a) });
    } else if (r0.kw === '2P') {
      const a = await getPoint('直径の1点目');
      const b = await getPoint('直径の2点目', { base:a, preview: cur => pvCircle(midp(a,cur), dist(a,cur)/2) });
      e = mkEnt('circle', { c: midp(a,b), r: dist(a,b)/2 });
    } else {
      const t1 = await getEnt('1つ目の接線オブジェクトを選択');
      const t2 = await getEnt('2つ目の接線オブジェクトを選択');
      const R = await askDist('円の半径を指定', null, 10);
      const s1 = nearestSeg(t1.ent, t1.p).seg, s2 = nearestSeg(t2.ent, t2.p).seg;
      const best = filletCalc(s1, t1.p, s2, t2.p, R);
      if (!best) { print('円を作成できません。', 'e'); return; }
      e = mkEnt('circle', { c: best.C, r: R });
    }
  } else {
    const r = await askDist('円の半径を指定', r0, undefined, { D:'直径(D)' });
    let rad;
    if (isKw(r)) rad = (await askDist('円の直径を指定', r0, 10)) / 2;
    else rad = r;
    if (!rad || rad <= 0) { print('半径が不正です。', 'e'); return; }
    e = mkEnt('circle', { c: r0, r: rad });
  }
  snap('円'); addEnt(e); draw();
});

function arc3(a,b,c) {
  const C = circum(a,b,c); if (!C) return null;
  const r = dist(C,a);
  const ccw = cross(sub(b,a), sub(c,b)) > 0;
  return mkEnt('arc', { c:C, r, a1: na(ccw ? angOf(C,a) : angOf(C,c)), a2: na(ccw ? angOf(C,c) : angOf(C,a)) });
}
def('ARC, A', '円弧', async () => {
  const r0 = await getPoint('円弧の始点を指定', { kw: { C:'中心(C)' } });
  if (r0 === null) return;
  let e = null;
  if (isKw(r0)) {
    const c = await getPoint('円弧の中心点を指定');
    const s = await getPoint('円弧の始点を指定', { base:c });
    const r = dist(c,s);
    const t = await getPoint('円弧の端点を指定', { base:c, kw:{ A:'角度(A)' },
      preview: cur => pvArc(c, r, angOf(c,s), angOf(c,cur)) });
    let a2;
    if (isKw(t)) { const ang = await askAngle('中心角を指定', c, Math.PI/2); a2 = angOf(c,s) + ang; }
    else a2 = angOf(c,t);
    e = mkEnt('arc', { c, r, a1: na(angOf(c,s)), a2: na(a2) });
  } else {
    const a = r0;
    const t = await getPoint('円弧の2点目を指定', { base:a, kw: { C:'中心(C)', E:'端点(E)' } });
    if (isKw(t) && t.kw === 'C') {
      const c = await getPoint('円弧の中心点を指定', { base:a });
      const r = dist(c,a);
      const t2 = await getPoint('円弧の端点を指定', { base:c, kw:{ A:'角度(A)', L:'弦長(L)' },
        preview: cur => pvArc(c, r, angOf(c,a), angOf(c,cur)) });
      let a2;
      if (isKw(t2) && t2.kw === 'A') { const ang = await askAngle('中心角を指定', c, Math.PI/2); a2 = angOf(c,a) + ang; }
      else if (isKw(t2)) { const L = await askDist('弦長を指定', a, r); a2 = angOf(c,a) + 2*Math.asin(Math.min(1, L/(2*r))); }
      else a2 = angOf(c,t2);
      e = mkEnt('arc', { c, r, a1: na(angOf(c,a)), a2: na(a2) });
    } else if (isKw(t)) {
      const b = await getPoint('円弧の端点を指定', { base:a });
      const t2 = await getPoint('円弧の中心点を指定', { base:b, kw:{ A:'角度(A)', R:'半径(R)' },
        preview: cur => { const x = arc3(a, midp(a,b), cur); } });
      if (isKw(t2) && t2.kw === 'R') {
        const R = await askDist('円弧の半径を指定', a, dist(a,b));
        const h = Math.sqrt(Math.max(0, R*R - Math.pow(dist(a,b)/2,2)));
        const m = midp(a,b), n = perp(norm(sub(b,a)));
        const C = add(m, mul(n, h));
        e = mkEnt('arc', { c:C, r:R, a1:na(angOf(C,a)), a2:na(angOf(C,b)) });
      } else if (isKw(t2)) {
        const ang = await askAngle('中心角を指定', a, Math.PI/2);
        const R = dist(a,b)/(2*Math.sin(Math.abs(ang)/2));
        const h = Math.sqrt(Math.max(0, R*R - Math.pow(dist(a,b)/2,2))) * (Math.abs(ang) > Math.PI ? -1 : 1);
        const m = midp(a,b), n = perp(norm(sub(b,a)));
        const C = add(m, mul(n, ang > 0 ? h : -h));
        e = mkEnt('arc', { c:C, r:R, a1:na(angOf(C, ang>0?a:b)), a2:na(angOf(C, ang>0?b:a)) });
      } else { const C = t2; e = mkEnt('arc', { c:C, r:dist(C,a), a1:na(angOf(C,a)), a2:na(angOf(C,b)) }); }
    } else {
      const b = t;
      const c = await getPoint('円弧の端点を指定', { base:b, preview: cur => { const x = arc3(a,b,cur);
        if (x) pvArc(x.c, x.r, x.a1, x.a2); } });
      e = arc3(a,b,c);
    }
  }
  if (!e) { print('円弧を作成できません。', 'e'); return; }
  snap('円弧'); addEnt(e); draw();
});

def('RECTANG, REC, RECTANGLE', '長方形', async () => {
  let fillet = 0, chamf = 0;
  let a = null;
  while (a === null) {
    const r = await getPoint('一方のコーナーを指定', { kw: { C:'面取り(C)', F:'フィレット(F)' } });
    if (r === null) return;
    if (isKw(r)) {
      if (r.kw === 'F') { fillet = await askDist('長方形のフィレット半径を指定', null, fillet); chamf = 0; }
      else { chamf = await askDist('長方形の面取り距離を指定', null, chamf); fillet = 0; }
      continue;
    }
    a = r;
  }
  const b = await getPoint('もう一方のコーナーを指定', { base:a, kw: { D:'寸法(D)' },
    preview: cur => pvPoly([a,[cur[0],a[1]],cur,[a[0],cur[1]]], true) });
  let c2 = b;
  if (isKw(b)) { const w = await askDist('長方形の長さを指定', a, 10);
                 const h = await askDist('長方形の幅を指定', a, 10);
                 c2 = [a[0]+w, a[1]+h]; }
  const P = [a, [c2[0],a[1]], c2, [a[0],c2[1]]];
  let pts = P, bul = [0,0,0,0];
  const w = Math.abs(c2[0]-a[0]), h = Math.abs(c2[1]-a[1]);
  const rr = Math.min(fillet || chamf, Math.min(w,h)/2);
  if (rr > 1e-9) {
    pts = []; bul = [];
    for (let i = 0; i < 4; i++) {
      const p = P[i], pp = P[(i+3)%4], pn = P[(i+1)%4];
      const d1 = norm(sub(pp,p)), d2 = norm(sub(pn,p));
      const A1 = add(p, mul(d1, rr)), A2 = add(p, mul(d2, rr));
      const C = add(p, mul(add(d1,d2), rr));
      const sg = Math.sign(cross(sub(A1,C), sub(A2,C))) || 1;
      pts.push(A1); bul.push(fillet ? sg*Math.tan(Math.PI/8) : 0);
      pts.push(A2); bul.push(0);
    }
  }
  snap('長方形');
  addEnt(mkEnt('pline', { pts, bulge: bul, closed: true, rect: true }));
  draw();
});

def('POLYGON, POL', 'ポリゴン', async () => {
  const n = await getInt('円に内接する辺の数を入力', { def: 4 });
  const N = Math.max(3, Math.min(1024, n || 4));
  const r0 = await getPoint('ポリゴンの中心を指定', { kw: { E:'エッジ(E)' } });
  let pts;
  if (isKw(r0)) {
    const a = await getPoint('エッジの1点目を指定');
    const b = await getPoint('エッジの2点目を指定', { base:a });
    const ang = TAU/N, R = dist(a,b)/(2*Math.sin(Math.PI/N));
    const c = add(midp(a,b), mul(perp(norm(sub(b,a))), R*Math.cos(Math.PI/N)));
    pts = []; const a0 = angOf(c,a);
    for (let i = 0; i < N; i++) pts.push(onCir(c, R, a0 - i*ang));
  } else {
    const k = await getKw('オプションを入力', { kw: { I:'内接(I)', C:'外接(C)' }, def: 'I', defVal: { kw:'I' } });
    const insc = !(isKw(k) && k.kw === 'C');
    const R = await askDist(insc ? '円の半径を指定' : '円の半径を指定', r0, 10, null);
    const RR = insc ? R : R/Math.cos(Math.PI/N);
    pts = [];
    for (let i = 0; i < N; i++) pts.push(onCir(r0, RR, Math.PI/2 + i*TAU/N));
  }
  snap('ポリゴン'); addEnt(mkEnt('pline', { pts, bulge: pts.map(()=>0), closed: true })); draw();
});

def('ELLIPSE, EL', '楕円', async () => {
  const r0 = await getPoint('楕円の軸の1点目を指定', { kw: { C:'中心(C)', A:'円弧(A)' } });
  let c, major, ratio;
  if (isKw(r0) && r0.kw === 'C') {
    c = await getPoint('楕円の中心を指定');
    const a = await getPoint('軸の端点を指定', { base:c, preview: cur => pvPoly(ellApprox(c, sub(cur,c), 1), true) });
    major = sub(a, c);
    const b = await askDist('もう一方の軸の長さを指定', c, vlen(major)/2);
    ratio = Math.max(1e-6, b/vlen(major));
  } else {
    const a = r0;
    const b = await getPoint('軸の2点目を指定', { base:a, preview: cur => pvLine(a,cur) });
    c = midp(a,b); major = sub(b,c);
    const d = await askDist('もう一方の軸の長さを指定', c, vlen(major)/2);
    ratio = Math.max(1e-6, d/vlen(major));
  }
  snap('楕円'); addEnt(mkEnt('ellipse', { c, major, ratio })); draw();
});
function ellApprox(c, major, ratio) {
  const e = { c, major, ratio }, out = [];
  for (let i = 0; i < 64; i++) out.push(ellipsePt(e, i/64*TAU));
  return out;
}

def('SPLINE, SPL', 'スプライン', async () => {
  const pts = [];
  while (true) {
    let r;
    try { r = await getPoint(pts.length ? '次の点を指定' : '1点目を指定',
      { base: pts[pts.length-1], kw: pts.length > 2 ? { C:'閉じる(C)' } : null,
        preview: cur => pvPoly(splinePts({ pts: pts.concat([cur]), closed:false }), false) }); }
    catch (e) { break; }
    if (r === null) break;
    if (isKw(r)) { if (r.kw === 'C' && pts.length > 2) { snap('スプライン');
      addEnt(mkEnt('spline', { pts, closed:true })); draw(); return; } continue; }
    pts.push(r); draw();
  }
  if (pts.length >= 2) { snap('スプライン'); addEnt(mkEnt('spline', { pts, closed:false })); draw(); }
});

def('POINT, PO', '点', async () => {
  while (true) {
    let p; try { p = await getPoint('点を指定'); } catch (e) { break; }
    if (!p || isKw(p)) break;
    snap('点'); addEnt(mkEnt('point', { p })); draw();
  }
});
def('XLINE, XL', '構築線', async () => {
  const a = await getPoint('点を指定'); if (!a || isKw(a)) return;
  while (true) { let b; try { b = await getPoint('通過点を指定', { base:a, preview: cur => {

    catch (e) { break; }
    if (!b || isKw(b)) break;
    snap('構築線'); addEnt(mkEnt('xline', { p1:a, p2:b })); draw(); }

def('RAY', '放射線', async () => {

def('TEXT, DT, DTEXT', '文字記入', async () => {
  const r0 = await getPoint('文字列の始点を指定', { kw: { J:'位置合わせ(J)', S:'スタイル(S)' } });
  let align = 'L', p;
  if (isKw(r0) && r0.kw === 'J') {
    const k = await getKw('オプションを入力', { kw: { L:'左(L)', C:'中央(C)', R:'右(R)' }, def:'L', defVal:{kw:'L'} });
    align = isKw(k) ? k.kw : 'L';
    p = await getPoint('文字列の中心を指定');
  } else if (isKw(r0)) { print('スタイルは「文字スタイル」ダイアログで設定します。'); return; }
  else p = r0;
  const h = await askDist('高さを指定', p, doc.textsize);
  if (typeof h === 'number' && h > 0) doc.textsize = h;
  const rot = await askAngle('文字列の角度を指定', p, 0);
  let cur = p, first = true, made = false;
  while (true) {
    let s; try { s = await getStr(first ? '文字列を入力' : '文字列を入力 (Enterで終了)'); } catch (e) { break; }
    if (s === null || s === '') break;
    if (!made) { snap('文字'); made = true; }
    addEnt(mkEnt('text', { p: cur, txt: s, h: doc.textsize, rot, align }));
    cur = add(cur, [ -Math.sin(rot)*doc.textsize*1.6, -Math.cos(rot)*doc.textsize*1.6 ]);
    first = false; draw();
  }
});
def('MTEXT, T, MT', 'マルチテキスト', async () => {
  const a = await getPoint('最初のコーナーを指定'); if (!a || isKw(a)) return;
  const b = await getPoint('もう一方のコーナーを指定', { base:a,
    preview: cur => pvPoly([a,[cur[0],a[1]],cur,[a[0],cur[1]]], true) });
  if (!b || isKw(b)) return;
  const w = Math.abs(b[0]-a[0]);
  const txt = await dlgText('マルチテキスト', '', doc.textsize);
  if (txt === null) return;
  snap('マルチテキスト');
  addEnt(mkEnt('mtext', { p: [Math.min(a[0],b[0]), Math.max(a[1],b[1])], txt: txt.txt,
                          h: txt.h, w, rot: 0, align: 'L' }));
  doc.textsize = txt.h; draw();
});

/* ---------- ハッチング ---------- */
def('HATCH, H, BHATCH', 'ハッチング', async () => {
  const o = await dlgHatch();
  if (!o) return;
  const made = [];
  if (o.mode === 'select') {
    const es = await needSel('境界オブジェクトを選択', e => entClosed(e) || e.type === 'pline' || e.type === 'spline');
    snap('ハッチング');
    es.forEach(e => { const loop = entPolyline(e);
      made.push(addEnt(mkEnt('hatch', { loops:[loop], pattern:o.pattern, scale:o.scale,
        angle:o.angle*D2R, color:o.color, alpha:o.alpha }))); });
  } else {
    snap('ハッチング');
    while (true) {
      let p; try { p = await getPoint('内部点をクリック (Enterで終了)'); } catch (e) { break; }
      if (!p || isKw(p)) break;
      const r = findRegion(p);
      if (!r || !r.loops) { print('閉じた境界が見つかりません。', 'e'); continue; }
      made.push(addEnt(mkEnt('hatch', { loops: r.loops, pattern:o.pattern, scale:o.scale,
        angle:o.angle*D2R, color:o.color, alpha:o.alpha })));
      print(r.loops.length > 1 ? '境界を検出（島 ' + (r.loops.length-1) + ' 個）' : '境界を検出');
      draw();
    }
  }
  if (!made.length) undo();
  clearSel(); draw();
});

def('COPY, CO, CP', '複写', async () => {
  const es = await needSel('オブジェクトを選択');
  const b = await getPoint('基点を指定');
  snap('複写'); let n = 0;
  while (true) {
    let p; try { p = await getPoint('2点目を指定 (Enterで終了)', { base:b, kw:{ A:'配列(A)' },
      preview: cur => { const m = Mat.mv(cur[0]-b[0], cur[1]-b[1]);
        es.forEach(e => pvEnt(entXform(clone(e), m))); pvLine(b,cur); } }); }
    catch (e) { break; }
    if (p === null) break;
    if (isKw(p)) {
      const cnt = await getInt('配列する項目数を入力', { def: 2 });
      const q = await getPoint('2点目を指定', { base:b });
      const d = sub(q,b);
      for (let i = 1; i <= (cnt||2)-1; i++) {
        const m = Mat.mv(d[0]*i, d[1]*i);
        es.forEach(e => { const c = clone(e); c.id = nextId++; addEnt(entXform(c, m)); }); n++;
      }
      break;
    }
    const m = Mat.mv(p[0]-b[0], p[1]-b[1]);
    es.forEach(e => { const c = clone(e); c.id = nextId++; addEnt(entXform(c, m)); });
    n++; draw();
  }
  if (!n) undo(); else print(n + ' 回複写しました');
  prevSel = es; clearSel(); draw();
});

def('OFFSET, O', 'オフセット', async () => {
  let d = await askDist('オフセット距離を指定', null, doc._off || 10, { T:'通過点(T)' });
  let through = false;
  if (isKw(d)) { through = true; } else { doc._off = d; }
  snap('オフセット'); let n = 0;
  while (true) {
    let r; try { r = await getEnt('オフセットするオブジェクトを選択 (Enterで終了)'); } catch (e) { break; }
    if (r === null) break;
    let side, dd = d;
    if (through) { const p = await getPoint('通過点を指定');
      if (!p || isKw(p)) break; side = p;
      const s = nearestSeg(r.ent, p).seg; dd = dist(p, segClosest(s, p));
      if (s.t === 'a') dd = Math.abs(dist(p, s.c) - s.r);

        const o = offsetEnt(r.ent, dd, cur); if (o) pvEnt(o); } });
      if (!p || isKw(p)) break; side = p;
    }
    const o = offsetEnt(r.ent, dd, side);
    if (o) { addEnt(o); n++; draw(); } else print('オフセットできません。', 'e');
  }
  if (!n) undo(); else print(n + ' 個をオフセットしました');

});

def('FILLET, F', 'フィレット', async () => {
  let R = doc._fillet === undefined ? 0 : doc._fillet;
  while (true) {
    print('現在の設定: 半径 = ' + fmt(R));
    const r1 = await getEnt('最初のオブジェクトを選択', { kw: { R:'半径(R)', P:'ポリライン(P)', T:'トリム(T)' } });
    if (r1 === null) return;
    if (isKw(r1)) {
      if (r1.kw === 'R') { R = await askDist('フィレット半径を指定', null, R); doc._fillet = R; continue; }
      if (r1.kw === 'P') { const pe = await getEnt('2D ポリラインを選択', { filter: e => e.type === 'pline' });
        snap('フィレット'); filletPolyline(pe.ent, R); draw(); return; }
      continue;
    }
    const r2 = await getEnt('2 番目のオブジェクトを選択');
    if (r2 === null) return;
    if (r1.ent === r2.ent && r1.ent.type === 'pline') {
      snap('フィレット'); filletPolylineAt(r1.ent, r1.p, r2.p, R); draw(); return;
    }
    const s1 = nearestSeg(r1.ent, r1.p), s2 = nearestSeg(r2.ent, r2.p);
    if (R < 1e-9) {
      const ip = segInter(s1.seg, s2.seg, true, true);
      if (!ip.length) { print('交差しません。', 'e'); continue; }
      ip.sort((a,b) => dist(a,r1.p)+dist(a,r2.p) - (dist(b,r1.p)+dist(b,r2.p)));
      snap('フィレット');
      replaceSeg(r1.ent, s1, trimSegToPoint(s1.seg, r1.p, ip[0]));
      replaceSeg(r2.ent, s2, trimSegToPoint(s2.seg, r2.p, ip[0]));
      draw(); return;
    }
    const best = filletCalc(s1.seg, r1.p, s2.seg, r2.p, R);
    if (!best) { print('半径 ' + fmt(R) + ' でフィレットできません。', 'e'); continue; }
    snap('フィレット');
    replaceSeg(r1.ent, s1, trimSegToPoint(s1.seg, r1.p, best.T1));
    replaceSeg(r2.ent, s2, trimSegToPoint(s2.seg, r2.p, best.T2));
    addEnt(makeFilletArc(best.C, best.T1, best.T2, r1.ent));
    draw(); return;
  }
});
def('CHAMFER, CHA', '面取り', async () => {
  let d1 = doc._cha1 === undefined ? 0 : doc._cha1, d2 = doc._cha2 === undefined ? d1 : doc._cha2;
  while (true) {
    print('現在の設定: 距離1 = ' + fmt(d1) + ', 距離2 = ' + fmt(d2));
    const r1 = await getEnt('最初の線分を選択', { kw: { D:'距離(D)', A:'角度(A)', P:'ポリライン(P)' } });
    if (r1 === null) return;
    if (isKw(r1)) {
      if (r1.kw === 'D') { d1 = await askDist('1 番目の面取り距離を指定', null, d1);
                           d2 = await askDist('2 番目の面取り距離を指定', null, d1);
                           doc._cha1 = d1; doc._cha2 = d2; }
      else if (r1.kw === 'A') { d1 = await askDist('1 番目の線分の面取り長さを指定', null, d1);
        const a = await askAngle('1 番目の線分からの面取り角度を指定', null, Math.PI/4);
        d2 = d1 * Math.tan(a); doc._cha1 = d1; doc._cha2 = d2; }
      else if (r1.kw === 'P') { const pe = await getEnt('2D ポリラインを選択', { filter: e => e.type === 'pline' });
        snap('面取り'); chamferPolyline(pe.ent, d1, d2); draw(); return; }
      continue;
    }
    const r2 = await getEnt('2 番目の線分を選択');
    if (r2 === null) return;
    const s1 = nearestSeg(r1.ent, r1.p), s2 = nearestSeg(r2.ent, r2.p);
    if (s1.seg.t !== 'l' || s2.seg.t !== 'l') { print('面取りは線分同士のみ対応します。', 'e'); continue; }
    const ip = segInter(s1.seg, s2.seg, true, true);
    if (!ip.length) { print('交差しません。', 'e'); continue; }
    const X = ip[0];
    const u1 = norm(sub(segParam(s1.seg, r1.p) > segParam(s1.seg, X) ? segEnd(s1.seg) : segStart(s1.seg), X));
    const u2 = norm(sub(segParam(s2.seg, r2.p) > segParam(s2.seg, X) ? segEnd(s2.seg) : segStart(s2.seg), X));
    const T1 = add(X, mul(u1, d1)), T2 = add(X, mul(u2, d2));
    snap('面取り');
    replaceSeg(r1.ent, s1, trimSegToPoint(s1.seg, r1.p, T1));
    replaceSeg(r2.ent, s2, trimSegToPoint(s2.seg, r2.p, T2));
    addEnt(mkEnt('line', { layer:r1.ent.layer, color:r1.ent.color, ltype:r1.ent.ltype, lw:r1.ent.lw, p1:T1, p2:T2 }));
    draw(); return;
  }
});
function replaceSeg(e, info, ns) {
  const segs = info.segs.slice(); segs[info.i] = ns;
  const outs = segsToEnts(segs, e);
  const i = ents().indexOf(e);
  if (outs.length === 1) { const o = outs[0]; o.id = e.id;
    Object.keys(e).forEach(k => { if (!(k in o)) delete e[k]; });
    Object.assign(e, o); if (e.type !== o.type) { ents()[i] = o; } }
  else { delEnt(e); outs.forEach(o => ents().push(o)); }
}
function filletPolylineAt(e, p1, p2, R) {
  const i1 = nearestSeg(e, p1).i, i2 = nearestSeg(e, p2).i;
  filletPolyVertex(e, Math.min(i1,i2), R);
}
function filletPolyVertex(e, i, R) {
  const segs = entSegs(e); const j = (i+1) % segs.length;
  if (j === 0 && !e.closed) return;
  const s1 = segs[i], s2 = segs[j];
  const best = filletCalc(s1, segAt(s1,0.5), s2, segAt(s2,0.5), R);
  if (!best) return;
  const n1 = trimSegToPoint(s1, segAt(s1,0.2), best.T1);
  const n2 = trimSegToPoint(s2, segAt(s2,0.8), best.T2);
  let a1 = angOf(best.C, best.T1), a2 = angOf(best.C, best.T2);
  const ccw = na(a2-a1) <= Math.PI;
  const arcSeg = { t:'a', c: best.C, r: dist(best.C, best.T1), s: a1, e: a2, ccw };
  const out = segs.slice(); out[i] = n1; out[j] = n2;
  out.splice(j, 0, arcSeg);
  const res = segsToEnts(out, e);
  const idx = ents().indexOf(e);
  if (res.length === 1) { res[0].id = e.id; res[0].closed = e.closed; ents()[idx] = res[0]; }
}
function filletPolyline(e, R) {
  const id = e.id;
  let cur = e, segs = entSegs(cur);
  const total = cur.closed ? segs.length : segs.length - 1;
  for (let k = 0; k < total; k++) {
    cur = ents().find(x => x.id === id);
    if (!cur || cur.type !== 'pline') break;
    const n = entSegs(cur).length, i = k*2;
    if (i + 1 >= n && !cur.closed) break;
    if (i >= n) break;
    filletPolyVertex(cur, i, R);
  }
}
function chamferPolyline(e, d1, d2) {
  const segs = entSegs(e); const out = []; const N = segs.length;
  for (let i = 0; i < N; i++) {
    const j = (i+1) % N; if (j === 0 && !e.closed) { out.push(segs[i]); continue; }
    const a = segs[i], b = segs[j];
    if (a.t !== 'l' || b.t !== 'l') { out.push(a); continue; }
    const X = segEnd(a);
    const T1 = add(X, mul(norm(sub(segStart(a), X)), d1));
    const T2 = add(X, mul(norm(sub(segEnd(b), X)), d2));
    out.push({ t:'l', a: a.a, b: T1 }, { t:'l', a: T1, b: T2 });
    segs[j] = { t:'l', a: T2, b: b.b };
  }
  const res = segsToEnts(out, e);
  const idx = ents().indexOf(e);
  if (res.length === 1) { res[0].id = e.id; res[0].closed = e.closed; ents()[idx] = res[0]; }
}

def('ARRAY, AR', '配列複写', async () => {
  const es = await needSel('オブジェクトを選択');
  const o = await dlgArray();
  if (!o) return;
  snap('配列複写');
  if (o.type === 'rect') {
    for (let r = 0; r < o.rows; r++) for (let c = 0; c < o.cols; c++) {
      if (!r && !c) continue;
      const m = Mat.mv(c*o.dx, r*o.dy);
      es.forEach(e => { const q = clone(e); q.id = nextId++; addEnt(entXform(q, m)); });
    }
  } else {
    const ctr = o.center;
    for (let i = 1; i < o.count; i++) {
      const a = o.fill * i / (o.close ? o.count : Math.max(1, o.count-1));
      es.forEach(e => {
        const q = clone(e); q.id = nextId++;
        if (o.rotate) addEnt(entXform(q, Mat.rotAt(a, ctr)));
        else { const b = entBBox(e), cp = [(b[0]+b[2])/2, (b[1]+b[3])/2];
               const np = rotP(cp, ctr, a);
               addEnt(entXform(q, Mat.mv(np[0]-cp[0], np[1]-cp[1]))); }
      });
    }
  }
  prevSel = es; clearSel(); draw();
});

def('EXPLODE, X', '分解', async () => {
  const es = await needSel('オブジェクトを選択');
  snap('分解'); let n = 0;
  es.forEach(e => { const r = explodeEnt(e); if (r && r.length) { delEnt(e); r.forEach(x => ents().push(x)); n++; } });
  print(n + ' 個を分解しました');

function explodeEnt(e) {
  const proto = { layer:e.layer, color:e.color, ltype:e.ltype, lw:e.lw };
  if (e.type === 'pline' || e.type === 'spline' || e.type === 'ellipse')
    return entSegs(e).map(s => segsToEnts([s], e)[0]);
  if (e.type === 'attdef')
    return [mkEnt('text', Object.assign({}, proto, { p:e.p, txt:e.dflt || e.tag,
      h:e.h, rot:e.rot||0, align:e.align||'L' }))];
  if (e.type === 'xref') return null;                 /* 外部参照は分解しない（XREF→バインド） */
  if (e.type === 'insert') { const b = doc.blocks[e.name]; if (!b) return null;
    const m = insMatrix(e);
    return b.ents.map(x => { const c = entXform(clone(x), m); c.id = nextId++;
      if (c.type === 'attdef') { c.type = 'text';
        c.txt = (e.attrs && e.attrs[x.tag] !== undefined) ? e.attrs[x.tag] : (x.dflt || ''); }
      if (c.layer === '0') c.layer = e.layer; return c; })
      .filter(c => !(c.type === 'text' && !c.txt)); }
  if (e.type === 'mtext') { const lines = mtextLines(e);
    return lines.map((L,i) => mkEnt('text', Object.assign({}, proto,
      { p: [e.p[0] - Math.sin(e.rot||0)*(i*e.h*1.5) , e.p[1] - Math.cos(e.rot||0)*(i*e.h*1.5) - e.h],
        txt:L, h:e.h, rot:e.rot||0, align:e.align||'L' }))); }
  if (e.type === 'dim') { const g = dimGeom(e); const out = [];
    g.lines.forEach(([a,b]) => out.push(mkEnt('line', Object.assign({}, proto, { p1:a, p2:b }))));
    g.arrows.forEach(([p,d]) => { const n2 = perp(d), L = g.asz, W = L*0.18;
      out.push(mkEnt('pline', Object.assign({}, proto, { pts:[p, add(add(p,mul(d,L)),mul(n2,W)),
        add(add(p,mul(d,L)),mul(n2,-W))], bulge:[0,0,0], closed:true }))); });
    if (g.txt) out.push(mkEnt('text', Object.assign({}, proto, { p:g.tp, txt:g.txt, h:g.h, rot:g.trot })));
    return out; }
  if (e.type === 'hatch') return e.loops.map(l => mkEnt('pline',
      Object.assign({}, proto, { pts:l, bulge:l.map(()=>0), closed:true })));
  return null;
}
def('JOIN, J', '結合', async () => {
  const es = await needSel('結合するオブジェクトを選択');
  snap('結合');
  let segs = [];
  es.forEach(e => segs = segs.concat(entSegs(e)));
  const chains = [];
  const used = new Array(segs.length).fill(false);
  for (let i = 0; i < segs.length; i++) {
    if (used[i]) continue;
    used[i] = true; let ch = [segs[i]];
    let grew = true;
    while (grew) { grew = false;
      for (let j = 0; j < segs.length; j++) { if (used[j]) continue;
        const s = segs[j];
        if (dist(segEnd(ch[ch.length-1]), segStart(s)) < 1e-7) { ch.push(s); used[j]=true; grew=true; }
        else if (dist(segEnd(ch[ch.length-1]), segEnd(s)) < 1e-7) { ch.push(segRev(s)); used[j]=true; grew=true; }
        else if (dist(segStart(ch[0]), segEnd(s)) < 1e-7) { ch.unshift(s); used[j]=true; grew=true; }
        else if (dist(segStart(ch[0]), segStart(s)) < 1e-7) { ch.unshift(segRev(s)); used[j]=true; grew=true; }
      } }
    chains.push(ch);
  }
  es.forEach(delEnt);
  chains.forEach(ch => segsToEnts(ch, es[0]).forEach(x => ents().push(x)));
  print(chains.length + ' 個のオブジェクトに結合しました');
  clearSel(); draw();
});

def('ALIGN, AL', '位置合わせ', async () => {
  const es = await needSel('オブジェクトを選択');
  const s1 = await getPoint('1 番目の元の点を指定');
  const d1 = await getPoint('1 番目の目的の点を指定', { base:s1 });
  const s2 = await getPoint('2 番目の元の点を指定');
  const d2 = await getPoint('2 番目の目的の点を指定', { base:s2 });
  const k = await getKw('位置合わせ点を基準にオブジェクトを尺度変更しますか?',
    { kw:{ Y:'はい(Y)', N:'いいえ(N)' }, def:'N', defVal:{kw:'N'} });
  const sc = (isKw(k) && k.kw === 'Y') ? dist(d1,d2)/(dist(s1,s2)||1) : 1;
  const ang = angOf(d1,d2) - angOf(s1,s2);
  let m = Mat.mv(-s1[0], -s1[1]);
  m = Mat.mul(m, Mat.sc(sc,sc));
  m = Mat.mul(m, Mat.rot(ang));
  m = Mat.mul(m, Mat.mv(d1[0], d1[1]));
  commit('位置合わせ', () => es.forEach(e => entXform(e, m)));
});

def('PEDIT, PE', 'ポリライン編集', async () => {
  const r = await getEnt('ポリラインを選択', { filter: e => ['pline','line','arc','spline'].includes(e.type) });
  let e = r.ent;
  if (e.type !== 'pline') {
    const k = await getKw('選択したオブジェクトはポリラインではありません。ポリラインに変換しますか?',
      { kw:{ Y:'はい(Y)', N:'いいえ(N)' }, def:'Y', defVal:{kw:'Y'} });
    if (isKw(k) && k.kw === 'N') return;
    snap('ポリライン編集');
    const segs = entSegs(e); const pts = [segStart(segs[0])], bul = [];
    segs.forEach(s => { pts.push(segEnd(s)); bul.push(s.t === 'a' ? arcToBulge(s) : 0); });
    const ne = mkEnt('pline', { layer:e.layer, color:e.color, ltype:e.ltype, lw:e.lw, pts, bulge:bul, closed:false });
    ne.id = e.id; ents()[ents().indexOf(e)] = ne; e = ne; draw();
  }
  while (true) {
    let k; try { k = await getKw('オプションを入力', { kw: { C: e.closed ? '開く(O)' : '閉じる(C)',
      J:'結合(J)', W:'幅(W)', R:'反転(R)', X:'終了(X)' } }); } catch (err) { break; }
    if (k === null || (isKw(k) && k.kw === 'X')) break;
    if (!isKw(k)) continue;
    snap('ポリライン編集');
    if (k.kw === 'C') e.closed = !e.closed;
    else if (k.kw === 'R') { e.pts.reverse(); if (e.bulge) { e.bulge.reverse(); e.bulge = e.bulge.map(b=>-b); } }
    else if (k.kw === 'W') { const w = await askDist('幅を指定', null, (e.lw||25)/100);
      e.lw = Math.round(w*100); }
    else if (k.kw === 'J') { print('結合したいオブジェクトを選択して JOIN コマンドを使用してください。'); }
    draw();
  }
  clearSel(); draw();
});

async function dimPickPoints() {
  const p1 = await getPoint('1 本目の寸法補助線の起点を指定 <オブジェクトを選択>', { allowEmpty:true });
  if (p1 === null) {
    const r = await getEnt('寸法記入するオブジェクトを選択');
    const segs = entSegs(r.ent);
    if (r.ent.type === 'circle' || r.ent.type === 'arc') return { circ: r.ent };
    const s = nearestSeg(r.ent, r.p).seg;
    return { p1: segStart(s), p2: segEnd(s) };
  }
  if (isKw(p1)) return null;
  const p2 = await getPoint('2 本目の寸法補助線の起点を指定', { base:p1 });
  if (!p2 || isKw(p2)) return null;
  return { p1, p2 };
}
def('DIMLINEAR, DLI, DIMLIN', '長さ寸法', async () => {
  const r = await dimPickPoints(); if (!r) return;
  if (r.circ) { print('円/円弧には DIMDIAMETER / DIMRADIUS を使用してください。', 'e'); return; }
  let rot = null, txt = '';
  const dp = await getPoint('寸法線の位置を指定', { kw: { H:'水平(H)', V:'垂直(V)', R:'回転(R)', T:'文字(T)' },
    preview: cur => pvDim({ dtype:'linear', p1:r.p1, p2:r.p2, dp:cur, rot: autoRot(r.p1,r.p2,cur) }) });
  let DP = dp;
  if (isKw(dp)) {
    if (dp.kw === 'H') rot = 0; else if (dp.kw === 'V') rot = Math.PI/2;
    else if (dp.kw === 'R') rot = await askAngle('寸法線の角度を指定', r.p1, 0);
    else if (dp.kw === 'T') { txt = await getStr('寸法値を入力'); }
    DP = await getPoint('寸法線の位置を指定', { preview: cur => pvDim({ dtype:'linear', p1:r.p1, p2:r.p2,
      dp:cur, rot: rot === null ? autoRot(r.p1,r.p2,cur) : rot, txt }) });
  }
  if (!DP || isKw(DP)) return;
  snap('長さ寸法');
  const e = mkEnt('dim', { dtype:'linear', p1:r.p1, p2:r.p2, dp:DP,
    rot: rot === null ? autoRot(r.p1,r.p2,DP) : rot, txt, style: doc.cdimstyle });
  addEnt(e); print('寸法値 = ' + fmt(dimGeom(e).val, doc.dim.prec)); draw();
});
function autoRot(p1,p2,dp) {
  const m = midp(p1,p2);
  return Math.abs(dp[1]-m[1]) >= Math.abs(dp[0]-m[0]) ? 0 : Math.PI/2;
}
function pvDim(o) {
  const e = Object.assign({ layer:doc.clayer, style: doc.cdimstyle }, o);
  const g = dimGeom(e);
  g.lines.forEach(([a,b]) => pvLine(a,b));
  g.arrows.forEach(([p,d]) => drawArrow(p,d,g.asz,g.ark));
  if (g.txt) drawTextRaw(g.tp, g.txt, g.h, g.trot, e, 'L', 'alphabetic');
}

    '<svg xmlns="http://www.w3.org/2000/svg" width="' + W.toFixed(3) + 'mm" height="' + H.toFixed(3) +
    'mm" viewBox="0 0 ' + W.toFixed(4) + ' ' + H.toFixed(4) + '">',
    '<rect width="100%" height="100%" fill="#ffffff"/>'];
  const strokeOf = e => { let c = effColor(e); if (c.toLowerCase() === '#ffffff') c = '#000000'; return c; };
  es.forEach(e => {
    const col = strokeOf(e), lw = Math.max(0.08, effLw(e)/100);
    const dash = LTYPES[effLtype(e)].d;
    const da = dash.length ? ' stroke-dasharray="' + dash.map(v=>(v*doc.ltscale).toFixed(2)).join(' ') + '"' : '';
    const A = ' fill="none" stroke="' + col + '" stroke-width="' + lw.toFixed(3) + '"' + da;
    if (e.type === 'text' || e.type === 'mtext') {
      const lines = e.type === 'mtext' ? mtextLines(e) : String(e.txt).split('\n');
      lines.forEach((t,k) => out.push('<text x="' + X(e.p[0]) + '" y="' +
        Y(e.p[1] - (e.type === 'mtext' ? (k+1)*e.h*1.5 : k*e.h*1.5)) + '" font-size="' + e.h +
        '" font-family="Yu Gothic, sans-serif" fill="' + col + '"' +
        ((e.rot) ? ' transform="rotate(' + (-e.rot*R2D).toFixed(3) + ' ' + X(e.p[0]) + ' ' + Y(e.p[1]) + ')"' : '') +
        '>' + esc(t) + '</text>'));
      return;
    }
    if (e.type === 'hatch') {
      const dpath = e.loops.map(l => 'M ' + l.map(p => X(p[0]) + ' ' + Y(p[1])).join(' L ') + ' Z').join(' ');
      out.push('<path d="' + dpath + '" fill="' + (e.pattern === 'SOLID' ? col : 'none') +
        '" fill-rule="evenodd" stroke="' + col + '" stroke-width="' + lw.toFixed(3) + '"/>');
      return;
    }
    if (e.type === 'dim' || e.type === 'insert') {
      (explodeEnt(e) || []).forEach(p => { p.layer = e.layer; svgEnt(p); });
      return;
    }
    svgEnt(e);
    function svgEnt(x) {
      if (x.type === 'text') { out.push('<text x="' + X(x.p[0]) + '" y="' + Y(x.p[1]) +
        '" font-size="' + x.h + '" font-family="Yu Gothic, sans-serif" fill="' + col + '">' + esc(x.txt) + '</text>'); return; }
      if (x.type === 'circle') { out.push('<circle cx="' + X(x.c[0]) + '" cy="' + Y(x.c[1]) +
        '" r="' + x.r.toFixed(4) + '"' + A + '/>'); return; }
      const segs = entSegs(x); if (!segs.length) return;
      let d = '';
      segs.forEach((s,k) => {
        const a = segStart(s), b = segEnd(s);
        if (k === 0 || dist(segEnd(segs[k-1]), a) > 1e-7) d += ' M ' + X(a[0]) + ' ' + Y(a[1]);
        if (s.t === 'l') d += ' L ' + X(b[0]) + ' ' + Y(b[1]);
        else { const large = segSweep(s) > Math.PI ? 1 : 0;
          d += ' A ' + s.r.toFixed(4) + ' ' + s.r.toFixed(4) + ' 0 ' + large + ' ' +
               (s.ccw ? 0 : 1) + ' ' + X(b[0]) + ' ' + Y(b[1]); }
      });
      out.push('<path d="' + d.trim() + '"' + A + '/>');
    }
  });
  out.push('</svg>');
  return out.join('\n');
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
}

/* ---------- ファイル コマンド ---------- */
def('NEW', '新規作成', async () => {

  doc = newDoc(); nextId = 1; sel = []; grips = []; undoStack = []; redoStack = [];

/** ファイル内容から図面を読み込む（OPEN / ドラッグ＆ドロップ 共通） */
function loadDrawing(name, text, handle) {

def('EXPORTSVG, SVGOUT', 'SVG 書き出し', async () => {

    clipBuf.forEach(e => pvEnt(entXform(clone(e), m))); } });
