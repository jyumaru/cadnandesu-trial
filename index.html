<script>
/* ============================================================================
   CADなんです  —  Part 5b : ペーパー空間 / レイアウト / ビューポート / 印刷尺度
   ========================================================================== */

/* ---------- 尺度リスト ---------- */
const SCALES = [
  ['1:1',1], ['1:2',0.5], ['1:2.5',0.4], ['1:5',0.2], ['1:10',0.1], ['1:20',0.05],
  ['1:25',0.04], ['1:30',1/30], ['1:40',0.025], ['1:50',0.02], ['1:60',1/60],
  ['1:75',1/75], ['1:100',0.01], ['1:150',1/150], ['1:200',0.005], ['1:250',0.004],
  ['1:500',0.002], ['1:1000',0.001], ['2:1',2], ['4:1',4], ['5:1',5], ['10:1',10]
];
function scaleName(v) {
  const f = SCALES.find(s => Math.abs(s[1]-v) < 1e-9);
  if (f) return f[0];
  return v >= 1 ? (fmt(v,4) + ':1') : ('1:' + fmt(1/v, 4));
}

/* ---------- 空間の切り替え ---------- */
function saveCam() {
  if (curVP()) return;                       /* MSPACE 中は syncMSpace が同期する */
  const c = { cx: view.cx, cy: view.cy, scale: view.scale };
  const L = curLayout();
  if (L) L.pview = c; else doc.mview = c;
}
function switchSpace(i) {
  if (doc.space === i && !curVP()) return;
  saveCam();
  doc.avpId = null; doc.space = i;
  clearSel();
  const L = curLayout();
  const c = L ? (L.pview || { cx:0, cy:0, scale:2 }) : (doc.mview || { cx:0, cy:0, scale:4 });
  Object.assign(view, { cx:c.cx, cy:c.cy, scale:c.scale, ox:null, oy:null });
  if (L && !L._seen) { L._seen = 1; ensureViewport(L); zoomPaper(L); }
  buildLayoutTabs(); refreshLayerUI(); updateProps(); draw();
  print(L ? ('レイアウト「' + L.name + '」（ペーパー空間）') : 'モデル空間');
}
function zoomPaper(L, m) {
  const P = paperSize(L);
  zoomWindow([-P[0]*0.04, -P[1]*0.04], [P[0]*1.04, P[1]*1.04], m === undefined ? 1.02 : m);
  view.ox = view.oy = null;
}
function enterMS(vp) {
  const L = curLayout(); if (!L || !vp) return;
  L.pview = { cx:view.cx, cy:view.cy, scale:view.scale };
  doc.avpId = vp.id; clearSel();
  const c = camPt(L.pview, vp.p);
  Object.assign(view, { cx:vp.cx, cy:vp.cy, scale:L.pview.scale*vp.vscale, ox:c[0], oy:c[1] });
  buildLayoutTabs(); updateProps(); draw();
  print('ビューポート内（モデル空間）— 尺度 ' + scaleName(vp.vscale) + (vp.locked ? ' / ロック中' : ''));
}
function exitMS() {
  const L = curLayout(); if (!L) return;
  syncMSpace();
  doc.avpId = null; clearSel();
  Object.assign(view, { cx:L.pview.cx, cy:L.pview.cy, scale:L.pview.scale, ox:null, oy:null });
  buildLayoutTabs(); updateProps(); draw();
  print('ペーパー空間');
}
/** MSPACE 中：ユーザーのズーム/パンを vp に書き戻し、画面上の中心を再計算する */
function syncMSpace() {
  const L = curLayout(), vp = curVP(); if (!L || !vp) return;
  if (vp.locked) view.scale = L.pview.scale * vp.vscale;
  else vp.vscale = view.scale / L.pview.scale;
  vp.cx = view.cx; vp.cy = view.cy;
  const c = camPt(L.pview, vp.p);
  view.ox = c[0]; view.oy = c[1];
}
function vpAt(paperPt) {
  const L = curLayout(); if (!L) return null;
  return L.entities.filter(e => e.type === 'viewport' && visible(e))
    .find(e => Math.abs(paperPt[0]-e.p[0]) <= e.w/2 && Math.abs(paperPt[1]-e.p[1]) <= e.h/2) || null;
}
/** モデル空間の図形が w×h（用紙 mm）に収まる表示中心と標準尺度を求める */
function fitModelTo(w, h) {
  const me = doc.entities.filter(visible);
  if (!me.length) return { cx:0, cy:0, vscale:1 };
  const bb = me.map(entBBox).reduce((x,y) =>
    [Math.min(x[0],y[0]), Math.min(x[1],y[1]), Math.max(x[2],y[2]), Math.max(x[3],y[3])]);
  const mw = Math.max(1e-6, bb[2]-bb[0]), mh = Math.max(1e-6, bb[3]-bb[1]);
  const fit = Math.min(w/mw, h/mh) * 0.92;
  /* 標準尺度のうち収まる最大のものを選ぶ */
  const cand = SCALES.map(s => s[1]).filter(v => v <= fit).sort((x,y) => y-x);
  return { cx: (bb[0]+bb[2])/2, cy: (bb[1]+bb[3])/2, vscale: cand.length ? cand[0] : fit };
}
/** レイアウトにビューポートが1つも無ければ、余白いっぱいに1つ作る。
    AutoCAD と同じく「レイアウトを開けば、そのままモデルに入れる」状態にするため。 */
function ensureViewport(L) {
  if (!L || L.entities.some(e => e.type === 'viewport')) return null;
  const P = paperSize(L);
  const a = [L.ml, L.mb], b = [P[0]-L.mr, P[1]-L.mt];
  const w = Math.max(10, b[0]-a[0]), h = Math.max(10, b[1]-a[1]);
  const f = fitModelTo(w, h);
  const vp = mkEnt('viewport', { p: midp(a,b), w, h, cx:f.cx, cy:f.cy, vscale:f.vscale, locked:false });
  /* 現在の画層が非表示だとビューポートごと消えてしまうので、画層 0 に置く */
  vp.layer = doc.layers.some(l => l.name === '0') ? '0' : doc.clayer;
  L.entities.push(vp);
  /* ここでは markDirty() しない。レイアウト タブを開いただけ／中に入っただけで
     「保存しますか?」と聞かれるのを避ける。自分で描けばその時点で未保存になるし、
     保存しないまま閉じても次に開いたときに作り直される。 */
  return vp;
}

/* ---------- 描画 ---------- */
function renderLayout(L) {
  const iv = { cx:view.cx, cy:view.cy, scale:view.scale, ox:view.ox, oy:view.oy };
  const active = curVP();
  if (active) syncMSpace();
  /* pv は必ずコピーにする。view を直接渡すと set() がそれ自身を書き換えてしまい、
     ビューポートの中身を描いたあと用紙カメラに戻れなくなる（枠が別位置に描かれる）。 */
  const pv = active ? L.pview
                    : { cx:iv.cx, cy:iv.cy, scale:iv.scale, ox:iv.ox, oy:iv.oy };

  ctx.fillStyle = '#30343b'; ctx.fillRect(0, 0, cvW, cvH);
  paperMode = true;
  const set = c => Object.assign(view, { cx:c.cx, cy:c.cy, scale:c.scale,
                                         ox: c.ox === undefined ? null : c.ox,
                                         oy: c.oy === undefined ? null : c.oy });
  set(pv);
  const P = paperSize(L);
  const a = w2s([0, P[1]]), b = w2s([P[0], 0]);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 14;
  ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(a[0], a[1], b[0]-a[0], b[1]-a[1]);
  ctx.restore();
  const m1 = w2s([L.ml, P[1]-L.mt]), m2 = w2s([P[0]-L.mr, L.mb]);
  ctx.save(); ctx.setLineDash([6,4]); ctx.strokeStyle = '#a9b2bd'; ctx.lineWidth = 1;
  ctx.strokeRect(m1[0]+.5, m1[1]+.5, m2[0]-m1[0], m2[1]-m1[1]); ctx.restore();

  /* ビューポートの中身 */
  L.entities.filter(e => e.type === 'viewport' && visible(e))
            .forEach(vp => { drawVPContents(vp, pv, set); set(pv); });

  /* ペーパー空間のオブジェクト */
  set(pv);
  L.entities.forEach(e => { if (e.type === 'hatch') drawEntity(e, false); });
  L.entities.forEach(e => { if (e.type !== 'hatch' && e.type !== 'viewport') drawEntity(e, false); });
  L.entities.forEach(e => { if (e.type === 'viewport' && visible(e)) drawVPBorder(e, e === active); });
  if (!active) sel.forEach(e => drawEntity(e, true));
  paperMode = false;
  set(iv);
}
function drawVPContents(vp, pv, set) {
  set(pv);
  const a = w2s([vp.p[0]-vp.w/2, vp.p[1]+vp.h/2]), b = w2s([vp.p[0]+vp.w/2, vp.p[1]-vp.h/2]);
  if (b[0]-a[0] < 2 || b[1]-a[1] < 2) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(a[0], a[1], b[0]-a[0], b[1]-a[1]); ctx.clip();
  set({ cx:vp.cx, cy:vp.cy, scale: pv.scale*vp.vscale, ox:(a[0]+b[0])/2, oy:(a[1]+b[1])/2 });
  doc.entities.forEach(e => { if (e.type === 'hatch') drawEntity(e, false); });
  doc.entities.forEach(e => { if (e.type !== 'hatch') drawEntity(e, false); });
  if (curVP() === vp) sel.forEach(e => drawEntity(e, true));
  ctx.restore();
}
function drawVPBorder(vp, isActive) {
  const a = w2s([vp.p[0]-vp.w/2, vp.p[1]+vp.h/2]), b = w2s([vp.p[0]+vp.w/2, vp.p[1]-vp.h/2]);
  ctx.save(); ctx.setLineDash([]);
  ctx.lineWidth = isActive ? 2 : 1;
  ctx.strokeStyle = isActive ? '#4a90d9' : (paperMode ? '#7d858f' : '#7d858f');
  ctx.strokeRect(a[0]+.5, a[1]+.5, b[0]-a[0], b[1]-a[1]);
  if (sel.includes(vp)) { ctx.setLineDash([7,4]); ctx.strokeStyle = '#00b0ff';
    ctx.strokeRect(a[0]+.5, a[1]+.5, b[0]-a[0], b[1]-a[1]); }
  ctx.restore();
}

/* ---------- レイアウト タブ ---------- */
function buildLayoutTabs() {
  const el = $('ltabs'); if (!el) return;
  const L = curLayout(), vp = curVP();
  let h = '<span class="ltab' + (doc.space < 0 ? ' on' : '') + '" data-i="-1">モデル</span>';
  (doc.layouts || []).forEach((x,i) => {
    h += '<span class="ltab' + (doc.space === i ? ' on' : '') + '" data-i="' + i + '">' + esc(x.name) + '</span>';
  });
  h += '<span class="ltadd" title="レイアウトを追加">＋</span>';
  /* 用紙 ⇄ ビューポート内モデルの切り替えは、ここを押せば済むと分かるようにする */
  const spTxt = doc.space < 0 ? 'モデル'
              : (vp ? 'モデル（ビューポート内）　▸ 用紙へ' : 'ペーパー　▸ モデルへ');
  const spTip = doc.space < 0 ? 'モデル空間'
              : (vp ? 'クリックでペーパー空間へ戻る（ビューポートの外をダブルクリックでも可）'
                    : 'クリックでビューポート内のモデル空間へ入る（ビューポートの中をダブルクリックでも可）');
  h += '<span class="lspace" title="' + esc(spTip) + '">' + esc(spTxt) + '</span>';
  if (L) h += '<span class="lsc">' + esc(L.name) + '  ' + paperSize(L)[0] + '×' + paperSize(L)[1] + ' mm' +
              (vp ? '   尺度 ' + scaleName(vp.vscale) : '') + '</span>';
  el.innerHTML = h;
  el.querySelectorAll('.ltab').forEach(t => {
    t.onclick = () => switchSpace(+t.dataset.i);
    t.oncontextmenu = ev => { ev.preventDefault(); if (+t.dataset.i >= 0) layoutMenu(+t.dataset.i, ev); };
  });
  el.querySelector('.ltadd').onclick = () => runCmd('LAYOUT NEW');
  const sp = el.querySelector('.lspace');
  if (sp && doc.space >= 0) sp.onclick = () => { if (curVP()) exitMS(); else runCmd('MSPACE'); };
}
async function layoutMenu(i, ev) {
  const k = await modal('レイアウト「' + doc.layouts[i].name + '」',
    '<div style="line-height:2">操作を選んでください。</div>',
    [['ページ設定','page',1],['名前を変更','ren'],['複製','copy'],['削除','del'],['閉じる',null]]);
  if (k === 'page') { switchSpace(i); await dlgPageSetup(doc.layouts[i]); }
  else if (k === 'ren') { const n = await getStr('新しいレイアウト名'); if (n) { snap('レイアウト名変更');
    doc.layouts[i].name = n; buildLayoutTabs(); } }
  else if (k === 'copy') { snap('レイアウト複製');
    const c = clone(doc.layouts[i]); c.name = uniqLayoutName(c.name + ' (2)');
    c.entities.forEach(e => e.id = nextId++);
    doc.layouts.splice(i+1, 0, c); switchSpace(i+1); }
  else if (k === 'del') {
    if (doc.layouts.length <= 1) { print('レイアウトは最低1つ必要です。', 'e'); return; }
    snap('レイアウト削除'); doc.layouts.splice(i,1);
    switchSpace(Math.min(i, doc.layouts.length-1));
  }
}
function uniqLayoutName(base) {
  let n = base, k = 2;
  while (doc.layouts.some(l => l.name === n)) n = base + ' ' + (k++);
  return n;
}

/* ---------- ページ設定 ---------- */
function dlgPageSetup(L) {
  const body =
    '<div class="fld"><label>用紙サイズ</label><select id="_ps">' +
      Object.keys(PAPERS).map(k => '<option value="' + k + '"' + (L.paper === k ? ' selected' : '') + '>' +
        k + '  (' + PAPERS[k][0] + '×' + PAPERS[k][1] + ' mm)</option>').join('') + '</select></div>' +
    '<div class="fld"><label>用紙の向き</label><select id="_po">' +
      '<option value="1"' + (L.land !== false ? ' selected' : '') + '>横 (ランドスケープ)</option>' +
      '<option value="0"' + (L.land === false ? ' selected' : '') + '>縦 (ポートレート)</option></select></div>' +
    '<fieldset><legend>余白 (mm)</legend>' +
    '<div class="fld"><label>左 / 右</label><input type="text" id="_ml" value="' + L.ml + '" style="width:70px">' +
      '<input type="text" id="_mr" value="' + L.mr + '" style="width:70px"></div>' +
    '<div class="fld"><label>上 / 下</label><input type="text" id="_mt" value="' + L.mt + '" style="width:70px">' +
      '<input type="text" id="_mb" value="' + L.mb + '" style="width:70px"></div></fieldset>' +
    '<div class="hint">印刷は用紙サイズどおりの実寸で出力します。ブラウザの印刷ダイアログでは<br>' +
    '「用紙サイズ」を同じものにし、「倍率 = 100%（実際のサイズ）」「余白 = なし」を選んでください。</div>';
  return modal('ページ設定 — ' + L.name, body, [['OK', d => {
    snap('ページ設定');
    const pv = d.querySelector('#_ps').value;
    if (PAPERS[pv]) L.paper = pv;
    const ov = d.querySelector('#_po').value;
    if (ov === '1' || ov === '0') L.land = ov === '1';
    const num = (i,dv) => { const v = parseFloat(d.querySelector(i).value); return isFinite(v) ? v : dv; };
    L.ml = num('#_ml', L.ml); L.mr = num('#_mr', L.mr);
    L.mt = num('#_mt', L.mt); L.mb = num('#_mb', L.mb);
    buildLayoutTabs(); zoomPaper(L); draw(); return 'ok'; }, 1], ['キャンセル', null]]);
}

/* ---------- 印刷 ---------- */
/** レイアウトを用紙実寸の SVG にする */
function svgLayout(L) {
  const P = paperSize(L), W = P[0], H = P[1];
  const X = x => x.toFixed(4), Y = y => (H - y).toFixed(4);
  const out = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + 'mm" height="' + H + 'mm" ' +
    'viewBox="0 0 ' + W + ' ' + H + '">', '<rect width="100%" height="100%" fill="#ffffff"/>'];
  const vps = L.entities.filter(e => e.type === 'viewport' && visible(e));
  if (vps.length) {
    out.push('<defs>');
    vps.forEach((vp,i) => out.push('<clipPath id="vp' + i + '"><rect x="' + X(vp.p[0]-vp.w/2) +
      '" y="' + Y(vp.p[1]+vp.h/2) + '" width="' + vp.w.toFixed(4) + '" height="' + vp.h.toFixed(4) + '"/></clipPath>'));
    out.push('</defs>');
  }
  vps.forEach((vp,i) => {
    out.push('<g clip-path="url(#vp' + i + ')">');
    const m = vpMatrix(vp);
    doc.entities.filter(visible).forEach(e => svgEntTo(out, entXform(clone(e), m), X, Y, vp.vscale));
    out.push('</g>');
  });
  L.entities.filter(e => e.type !== 'viewport' && visible(e))
            .forEach(e => svgEntTo(out, e, X, Y, 1));
  out.push('</svg>');
  return out.join('\n');
}
/** 1エンティティを SVG 断片にして out に積む（X/Y は世界→用紙mm の写像） */
function svgEntTo(out, e, X, Y, sc) {
  let col = effColor(e);
  if (col.toLowerCase() === '#ffffff') col = '#000000';
  const lw = Math.max(0.05, effLw(e)/100);
  const dash = LTYPES[effLtype(e)].d;
  const da = dash.length
    ? ' stroke-dasharray="' + dash.map(v => Math.max(0.05, v*doc.ltscale*(sc||1)).toFixed(3)).join(' ') + '"' : '';
  const A = ' fill="none" stroke="' + col + '" stroke-width="' + lw.toFixed(3) + '"' + da;
  const esc2 = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (e.type === 'text' || e.type === 'mtext') {
    const lines = e.type === 'mtext' ? mtextLines(e) : String(e.txt).split('\n');
    const anchor = e.align === 'C' ? 'middle' : e.align === 'R' ? 'end' : 'start';
    lines.forEach((t,k) => {
      const p = [e.p[0] - Math.sin(e.rot||0)*(e.type === 'mtext' ? (k+1)*e.h*1.5 : k*e.h*1.5),
                 e.p[1] - Math.cos(e.rot||0)*(e.type === 'mtext' ? (k+1)*e.h*1.5 : k*e.h*1.5)];
      out.push('<text x="' + X(p[0]) + '" y="' + Y(p[1]) + '" font-size="' + e.h.toFixed(4) +
        '" font-family="Yu Gothic, Meiryo, sans-serif" text-anchor="' + anchor + '" fill="' + col + '"' +
        (e.rot ? ' transform="rotate(' + (-e.rot*R2D).toFixed(3) + ' ' + X(p[0]) + ' ' + Y(p[1]) + ')"' : '') +
        '>' + esc2(t) + '</text>');
    });
    return;
  }
  if (e.type === 'hatch') {
    const d = e.loops.map(l => 'M ' + l.map(p => X(p[0]) + ' ' + Y(p[1])).join(' L ') + ' Z').join(' ');
    if (e.pattern === 'SOLID' || !HPAT[e.pattern]) {
      out.push('<path d="' + d + '" fill="' + col + '" fill-rule="evenodd" stroke="none"/>');
    } else {
      const id = 'h' + (svgEntTo._n = (svgEntTo._n||0) + 1);
      const b = bboxOf([].concat(...e.loops));
      out.push('<clipPath id="' + id + '"><path d="' + d + '" clip-rule="evenodd"/></clipPath>');
      out.push('<g clip-path="url(#' + id + ')">');
      const R = Math.hypot(b[2]-b[0], b[3]-b[1])/2 + 1, cx0 = (b[0]+b[2])/2, cy0 = (b[1]+b[3])/2;
      HPAT[e.pattern].forEach(defn => {
        const ang = defn.a*D2R + (e.angle||0), sp = defn.d*(e.scale||1);
        if (sp <= 1e-6) return;
        const dv = [Math.cos(ang), Math.sin(ang)], nv = perp(dv);
        let dd = '';
        for (let i = -Math.ceil(R/sp); i <= Math.ceil(R/sp); i++) {
          const o = add([cx0,cy0], mul(nv, i*sp + (defn.o||0)*(e.scale||1)));
          const A1 = sub(o, mul(dv,R)), B1 = add(o, mul(dv,R));
          dd += 'M ' + X(A1[0]) + ' ' + Y(A1[1]) + ' L ' + X(B1[0]) + ' ' + Y(B1[1]) + ' ';
        }
        out.push('<path d="' + dd.trim() + '" fill="none" stroke="' + col + '" stroke-width="' +
          Math.max(0.05, lw*0.7).toFixed(3) + '"' +
          (defn.dash ? ' stroke-dasharray="' + defn.dash.map(v => (v*(e.scale||1)).toFixed(3)).join(' ') + '"' : '') + '/>');
      });
      out.push('</g>');
    }
    return;
  }
  if (e.type === 'dim' || e.type === 'insert') {
    (explodeEnt(e) || []).forEach(x => { if (!x.layer) x.layer = e.layer; svgEntTo(out, x, X, Y, sc); });
    return;
  }
  if (e.type === 'viewport') return;
  if (e.type === 'circle') {
    out.push('<circle cx="' + X(e.c[0]) + '" cy="' + Y(e.c[1]) + '" r="' + e.r.toFixed(4) + '"' + A + '/>');
    return;
  }
  const segs = entSegs(e); if (!segs.length) return;
  let d = '';
  segs.forEach((s,k) => {
    const p0 = segStart(s), p1 = segEnd(s);
    if (k === 0 || dist(segEnd(segs[k-1]), p0) > 1e-7) d += ' M ' + X(p0[0]) + ' ' + Y(p0[1]);
    if (s.t === 'l') d += ' L ' + X(p1[0]) + ' ' + Y(p1[1]);
    else d += ' A ' + s.r.toFixed(4) + ' ' + s.r.toFixed(4) + ' 0 ' +
              (segSweep(s) > Math.PI ? 1 : 0) + ' ' + (s.ccw ? 0 : 1) + ' ' + X(p1[0]) + ' ' + Y(p1[1]);
  });
  out.push('<path d="' + d.trim() + '"' + A + '/>');
}
/** モデル空間を「用紙 + 尺度」で印刷用 SVG にする */
function svgModelPlot(o) {
  const W = o.W, H = o.H;
  const es = doc.entities.filter(visible);
  if (!es.length) return null;
  let b = es.map(entBBox).reduce((a,c) =>
    [Math.min(a[0],c[0]), Math.min(a[1],c[1]), Math.max(a[2],c[2]), Math.max(a[3],c[3])]);
  if (o.win) b = o.win;
  const s = o.scale;                       /* 用紙mm / 図面単位 */
  const cx = (b[0]+b[2])/2, cy = (b[1]+b[3])/2;
  const X = x => ((x-cx)*s + W/2).toFixed(4);
  const Y = y => (H/2 - (y-cy)*s).toFixed(4);
  const out = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + 'mm" height="' + H + 'mm" ' +
    'viewBox="0 0 ' + W + ' ' + H + '">', '<rect width="100%" height="100%" fill="#ffffff"/>'];
  const m = Mat.mul(Mat.mul(Mat.mv(-cx,-cy), Mat.sc(s,s)), Mat.mv(W/2, H/2));
  const X2 = x => x.toFixed(4), Y2 = y => (H - y).toFixed(4);
  es.forEach(e => svgEntTo(out, entXform(clone(e), m), X2, Y2, s));
  out.push('</svg>');
  return out.join('\n');
}
function printSVG(svg, W, H, name) {
  if (TRIAL) svg = trialMark(svg, W, H);
  const w = window.open('', '_blank');
  if (!w) { print('ポップアップがブロックされました。ブラウザの設定で許可してください。', 'e'); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><title>' + esc(name) + '</title>' +
    '<style>@page{size:' + W + 'mm ' + H + 'mm;margin:0}html,body{margin:0;padding:0}' +
    'svg{display:block;width:' + W + 'mm;height:' + H + 'mm}</style>' + svg);
  w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 500);
}

def('LAYOUT, LO', 'レイアウト', async (args) => {

def('MVIEW, MV', 'ビューポート作成', async () => {
  const L = curLayout();
  if (!L) { print('ビューポートはレイアウト タブでのみ作成できます。', 'e'); return; }
  if (curVP()) exitMS();
  const r = await getPoint('ビューポートのコーナーを指定', { kw: { F:'用紙全体(F)' } });
  if (r === null) return;
  let a, b;
  if (isKw(r)) { const P = paperSize(L);
    a = [L.ml, L.mb]; b = [P[0]-L.mr, P[1]-L.mt]; }

def('VPSCALE, VPS', 'ビューポート尺度', async () => {

  return modal('ビューポートの尺度', body, [['OK', d => {

async function dlgPlotModel() {
  const es = doc.entities.filter(visible);
  if (!es.length) { print('印刷する図形がありません。', 'e'); return null; }
  const bb = es.map(entBBox).reduce((a,c) =>
    [Math.min(a[0],c[0]), Math.min(a[1],c[1]), Math.max(a[2],c[2]), Math.max(a[3],c[3])]);
  const body =
    '<div class="fld"><label>用紙サイズ</label><select id="_pp">' +
      Object.keys(PAPERS).map(k => '<option value="' + k + '"' + (k === 'A3' ? ' selected' : '') + '>' +
        k + '  (' + PAPERS[k][0] + '×' + PAPERS[k][1] + ' mm)</option>').join('') + '</select></div>' +
    '<div class="fld"><label>用紙の向き</label><select id="_pl">' +
      '<option value="1" selected>横</option><option value="0">縦</option></select></div>' +
    '<div class="fld"><label>印刷尺度</label><select id="_pc">' +
      '<option value="fit" selected>用紙に合わせる</option>' +
      SCALES.map(s => '<option value="' + s[1] + '">' + s[0] + '</option>').join('') + '</select></div>' +
    '<div class="fld"><label>任意尺度 1:</label><input type="text" id="_px" placeholder="例 50"></div>' +
    '<div class="hint">図面範囲: ' + fmt(bb[2]-bb[0],1) + ' × ' + fmt(bb[3]-bb[1],1) + ' 図面単位<br>' +
    '図面単位 = mm として扱います。より作り込んだ図面はレイアウト タブ + ビューポートを推奨。</div>';
  const r = await modal('印刷（モデル空間）', body, [['OK', d => ({
      paper: d.querySelector('#_pp').value, land: d.querySelector('#_pl').value === '1',
      sc: d.querySelector('#_pc').value, cust: parseFloat(d.querySelector('#_px').value) }), 1],
    ['キャンセル', null]]);
  if (!r) return null;
  const key = PAPERS[r.paper] ? r.paper : 'A3';
  const dsz = PAPERS[key], W = r.land ? dsz[0] : dsz[1], H = r.land ? dsz[1] : dsz[0];
  const fit = Math.min((W-20)/Math.max(1e-6, bb[2]-bb[0]), (H-20)/Math.max(1e-6, bb[3]-bb[1]));
  let s;
  if (r.cust && r.cust > 0) s = 1/r.cust;
  else if (r.sc === 'fit') s = fit;
  else s = parseFloat(r.sc);
  if (!isFinite(s) || s <= 0) s = fit;
  return { paper: key, W, H, scale: s };
}

function planarFaces(list) {

      if (ts.length < 2) { edges.push(segSub(s,0,0.5), segSub(s,0.5,1)); return; }

    const r = Math.max(cvW, cvH) / view.scale;

    list = list.filter(e => bboxHit(entBBox(e), win));
    faces = planarFaces(list);

  }
  const ccw = faces.filter(f => f.area > 1e-12);
  const inside = ccw.filter(f => ptInPoly(pw, f.poly)).sort((a,b) => a.area - b.area);

  const kids = ccw.filter(f => f !== target && f.area < target.area &&

    doc = newDoc(); nextId = 1;
    dxfParseInto(text);

function attachXref(name, sub, p, sx, rot) {
  doc.xrefs = doc.xrefs || {};
  const lmap = {};
  sub.layers.forEach(l => {
    const n = name + '|' + l.name;
    if (!doc.layers.find(x => x.name === n))
      doc.layers.push(Object.assign({}, l, { name:n, xref:true, locked:true }));
    lmap[l.name] = n;
  });
  const bmap = {};
  Object.keys(sub.blocks || {}).forEach(bn => {
    const n = name + '|' + bn;
    doc.blocks[n] = { ents: sub.blocks[bn].ents.map(e => { const c = clone(e); c.id = nextId++;
      c.layer = lmap[c.layer] || (name + '|0'); return c; }), base: sub.blocks[bn].base };
    bmap[bn] = n;
  });
  const es = sub.entities.map(e => { const c = clone(e); c.id = nextId++;
    c.layer = lmap[c.layer] || (name + '|0');
    if (c.type === 'insert' && bmap[c.name]) c.name = bmap[c.name];
    return c; });
  doc.xrefs[name] = { file: name, ents: es, layers: Object.keys(lmap).map(k => lmap[k]) };
  return doc.xrefs[name];
}

async function xrefReload(n) {
  const f = await pickFile('.jcad,.json,.dxf');
  if (!f) return;
  let sub;
  try { sub = parseDrawing(f.name, f.text); }
  catch (err) { print('読み込みに失敗しました: ' + err.message, 'e'); return; }
  snap('外部参照の再ロード');
  attachXref(n, sub, [0,0], 1, 0);
  refreshLayerUI(); draw();
  print('外部参照 "' + n + '" を再ロードしました。', 'g');
}
function xrefBind(n) {
  const x = doc.xrefs[n]; if (!x) return;
  snap('外部参照のバインド');
  let bn = n, k = 2;
  while (doc.blocks[bn]) bn = n + '_' + (k++);
  doc.blocks[bn] = { ents: x.ents.map(e => clone(e)), base: [0,0] };
  [doc.entities].concat((doc.layouts||[]).map(l => l.entities)).forEach(arr => {
    arr.forEach((e,i) => { if (e.type === 'xref' && e.name === n) {
      arr[i] = mkEnt('insert', { layer:e.layer, color:e.color, ltype:e.ltype, lw:e.lw,
        name:bn, p:e.p, sx:e.sx, sy:e.sy, rot:e.rot }); } });
  });
  doc.layers.forEach(l => { if (l.name.indexOf(n + '|') === 0) { l.xref = false; l.locked = false; } });
  delete doc.xrefs[n];
  refreshLayerUI(); draw();
  print('外部参照 "' + n + '" をブロック "' + bn + '" としてバインドしました。', 'g');
}
function xrefDetach(n) {
  snap('外部参照のデタッチ');
  [doc.entities].concat((doc.layouts||[]).map(l => l.entities)).forEach(arr => {
    for (let i = arr.length-1; i >= 0; i--) if (arr[i].type === 'xref' && arr[i].name === n) arr.splice(i,1);
  });
  doc.layers = doc.layers.filter(l => l.name.indexOf(n + '|') !== 0);
  Object.keys(doc.blocks).forEach(b => { if (b.indexOf(n + '|') === 0) delete doc.blocks[b]; });
  delete doc.xrefs[n];
  refreshLayerUI(); updateProps(); draw();
  print('外部参照 "' + n + '" をデタッチしました。', 'g');
}

function applyProp(key, val) {
  if (val === '*可変*') return;
  snap('プロパティ変更');
  sel.forEach(e => {
    const num = parseFloat(val);
    if (key === 'color' || key === 'lw') { e[key] = parseInt(val,10); return; }
    if (key === 'layer' || key === 'ltype' || key === 'align' || key === 'pattern') { e[key] = val; return; }
    if (key === 'txt') { e.txt = val; return; }
    if (key === 'closed') { e.closed = !!val; return; }
    if (key === 'locked') { e.locked = !!val; return; }
    if (key === 'inv' || key === 'const') { e[key] = !!val; return; }
    if (key === 'style') { e.style = val; return; }
    if (key === 'tag' || key === 'prompt' || key === 'dflt') { e[key] = val; return; }
    if (key === 'rotdeg') { e.rot = (parseFloat(val)||0)*D2R; return; }
    if (key === 'angledeg') { e.angle = (parseFloat(val)||0)*D2R; return; }
    if (key === 'a1deg') { e.a1 = na((parseFloat(val)||0)*D2R); return; }
    if (key === 'a2deg') { e.a2 = na((parseFloat(val)||0)*D2R); return; }
    if (key.includes('.')) { const [k,i] = key.split('.'); if (e[k]) e[k][+i] = num; return; }
    if (!isNaN(num)) e[key] = num;
  });

}

let acSel = -1;
function updateAc() {
  const ac = $('ac');
  if (inp || !cin.value.trim()) { ac.style.display = 'none'; acSel = -1; return; }
  const t = cin.value.trim().toUpperCase();
  const hits = [];
  Object.keys(ALIAS).forEach(a => { if (a.startsWith(t)) hits.push([a, CMD[ALIAS[a]].hint, ALIAS[a]]); });
  Object.keys(CMD).forEach(n => { if (n.startsWith(t) && !hits.some(h => h[2] === n && h[0] === n)) hits.push([n, CMD[n].hint, n]); });
  hits.sort((a,b) => a[0].length - b[0].length || a[0].localeCompare(b[0]));
  if (!hits.length) { ac.style.display = 'none'; acSel = -1; return; }
  ac.innerHTML = hits.slice(0,14).map(([a,h,n],i) => '<div data-v="' + a + '"' + (i===0?' class="on"':'') +
    '><b>' + a + '</b><span>' + esc(h) + (a !== n ? '  → ' + n : '') + '</span></div>').join('');
  acSel = 0; ac.style.display = 'block';
  ac.querySelectorAll('div').forEach(d => d.onmousedown = ev => { ev.preventDefault();
    cin.value = d.dataset.v; ac.style.display='none'; submit(cin.value); });

/* 図形が1つも無い図面（起動直後の Drawing1 など）は保存も復元もしない。
   空でも serialize() は80字を超えるので、これが無いと毎回「前回の作業を復元しますか?」が出る。 */
function docIsEmpty(d) {
  return !((d.entities && d.entities.length) ||
           (d.layouts || []).some(L => L.entities && L.entities.length));
}
function autosave() { try {
  if (docIsEmpty(doc)) { localStorage.removeItem('jcad.auto'); localStorage.removeItem('jcad.autoname'); return; }
  localStorage.setItem('jcad.auto', serialize());
  localStorage.setItem('jcad.autoname', fileName); } catch (e) {} }
/* ---------- 図面ファイルのドラッグ＆ドロップ ---------- */
function setupDrop() {
  const zone = $('drop');
  let depth = 0;
  const show = on => { if (zone && zone.classList) zone.classList[on ? 'add' : 'remove']('on'); };
  window.addEventListener('dragenter', ev => { ev.preventDefault(); depth++; show(true); });
  window.addEventListener('dragover',  ev => { ev.preventDefault(); });
  window.addEventListener('dragleave', ev => { ev.preventDefault(); if (--depth <= 0) show(false); });
  window.addEventListener('drop', ev => {
    ev.preventDefault(); depth = 0; show(false);
    const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    if (!/\.(jcad|json|dxf|txt)$/i.test(f.name)) {
      print('対応していないファイルです: ' + f.name, 'e'); return; }
    const r = new FileReader();
    r.onload = () => { loadDrawing(f.name, r.result, null); };
    r.onerror = () => print('ファイルを読めませんでした。', 'e');
    r.readAsText(f, 'utf-8');
  });
}

  buildRibbon(); buildQAT(); bindStatus(); buildLayoutTabs();
  window.addEventListener('resize', resize);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => resize()).observe($('cvwrap'));
  } else {                                     /* 古いブラウザ用の代替 */
    let lw = 0, lh = 0;
    setInterval(() => { const r = $('cvwrap').getBoundingClientRect();
      if (Math.round(r.width) !== lw || Math.round(r.height) !== lh) {
        lw = Math.round(r.width); lh = Math.round(r.height); resize(); } }, 300);
  }
  $('verlbl').textContent = 'v' + JCAD_VERSION + (TRIAL ? ' 体験版' : '');
  setupDrop();
  resize();
  print('CADなんです  —  AutoCAD 互換 2D 製図');
  print('コマンド名またはエイリアスを入力してください（例: L=線分, C=円, TR=トリム）。F1 でコマンド一覧。');
  if (TRIAL) {
    print('― 体験版です。保存と書き出し（.jcad / DXF / SVG / PNG / CSV）はできません。印刷には透かしが入ります。', 'e');
    print('  描く・編集する・図面を開く・印刷する、はすべて製品版と同じです。');
  }
  const auto = (() => { try { return localStorage.getItem('jcad.auto'); } catch (e) { return null; } })();
  const autoEmpty = (() => { try { return docIsEmpty(JSON.parse(auto).doc); } catch (e) { return false; } })();
  if (auto && auto.length > 80 && autoEmpty) { try { localStorage.removeItem('jcad.auto'); } catch (e) {} }
  else if (auto && auto.length > 80) {
    const k = await modal('前回の作業を復元しますか?',
      '<div style="line-height:1.9">前回終了時の図面が自動保存されています。<br>' +
      '<b>' + esc(localStorage.getItem('jcad.autoname') || 'Drawing1') + '</b><br>' +
      '<span style="color:#8b939e">「新規」を選ぶと自動保存は破棄されます。</span></div>',
      [['復元する','y',1],['新規で始める','n']]);
    if (k === 'y') { try { deserialize(auto); fileName = localStorage.getItem('jcad.autoname') || 'Drawing1';
      markClean(); print('前回の図面を復元しました。', 'g'); } catch (e) { print('復元に失敗しました。', 'e'); } }
    else { try { localStorage.removeItem('jcad.auto'); } catch (e) {} }
  }
  setInterval(autosave, 20000);
  window.addEventListener('beforeunload', ev => { autosave();
    if (dirty) { ev.preventDefault(); ev.returnValue = ''; } });
  setPrompt('コマンド: '); cin.focus(); draw();
}
function showBootError(err) {
  console.error(err);
  try {
    document.body.innerHTML =
      '<div style="font:14px/1.9 \'Segoe UI\',\'Yu Gothic UI\',Meiryo,sans-serif;color:#d8dce2;' +
      'background:#22252a;padding:40px;height:100vh;box-sizing:border-box">' +
      '<div style="font-size:20px;color:#e0655f;margin-bottom:14px">CADなんです の起動に失敗しました</div>' +
      '<div style="background:#2b2f36;border:1px solid #454b55;padding:14px 18px;border-radius:4px;' +
      'font-family:Consolas,monospace;font-size:12.5px;white-space:pre-wrap">' +
      'v' + JCAD_VERSION + ' (build ' + JCAD_BUILD + ')\n' +
      String(err && err.stack || err).replace(/</g,'&lt;') + '\n\n' +
      String((typeof navigator !== 'undefined' && navigator.userAgent) || '-').replace(/</g,'&lt;') +
      '</div>' +
      '<div style="margin-top:14px;color:#98a1ad">この内容をコピーして報告してください。' +
      'ページを再読み込み（F5）すると前回の自動保存から復元できます。</div></div>';
  } catch (e2) {}
}
/* 起動ガードが NG を出していたら何もしない */
if (typeof window === 'undefined' || window.__JCAD_OK !== false) {
  try { const r = boot(); if (r && r.catch) r.catch(showBootError); }
  catch (err) { showBootError(err); }
}
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
